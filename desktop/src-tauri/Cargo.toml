[package]
name = "clarify-settings"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
