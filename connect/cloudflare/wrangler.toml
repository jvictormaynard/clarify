# Placeholders only. The coordinator must configure and authorize deployment.
name = "clarify-connect-preview"
main = "worker.mjs"
compatibility_date = "2026-10-29"
account_id = "00000000000000000000000000000000"
workers_dev = false
preview_urls = false
routes = []

[observability]
enabled = false

[vars]
CONNECT_ENABLED = "false"
CONTROL_URL = "https://clarify-connect.victormaynard.com"
TUNNEL_DOMAIN = "victormaynard.com"
CLARIFY_API_URL = "https://configure-before-use.invalid"
CF_ACCOUNT_ID = "00000000000000000000000000000000"
CF_ZONE_ID = "00000000000000000000000000000000"
GLOBAL_COMPUTER_LIMIT = "900"
# CF_API_TOKEN must be a server-side Worker secret, never a public variable.

[[d1_databases]]
binding = "DB"
database_name = "configure-before-use"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
