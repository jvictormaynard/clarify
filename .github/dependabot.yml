version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: /
    groups:
      qt:
        patterns:
          - pyside6-essentials
          - shiboken6
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
