name: Validate and build Settings
description: Validate Settings in a browser and optionally compile the native child application.
inputs:
  python:
    description: Python interpreter with the repository development dependencies installed
    required: true
  native:
    description: Compile the native Settings executable and collect its inventory
    default: "true"
  test:
    description: Run the isolated browser and Python bridge tests
    default: "true"
  audit:
    description: Audit dependencies during a release build
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "22.21.1"
        cache: npm
        cache-dependency-path: desktop/package-lock.json
    - name: Check native toolchain
      id: toolchain
      if: ${{ (inputs.native == 'true') }}
      shell: pwsh
      working-directory: desktop
      run: |
        rustc --version
        if ($LASTEXITCODE -ne 0) { throw 'The Windows runner must provide Rust MSVC.' }
        cargo --version
        if ($LASTEXITCODE -ne 0) { throw 'Cargo is required.' }
        $rustVersion = (rustc --version) -replace '[^a-zA-Z0-9.-]', '-'
        "rust=$rustVersion" >> $env:GITHUB_OUTPUT
    - name: Restore native compilation cache
      if: ${{ (inputs.native == 'true') }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          desktop/src-tauri/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ hashFiles('desktop/src-tauri/src/**', 'desktop/src-tauri/build.rs', 'desktop/src-tauri/tauri.conf.json') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-
    - name: Install locked frontend dependencies
      shell: pwsh
      working-directory: desktop
      run: npm ci --no-fund
    - name: Audit frontend and build dependencies
      if: ${{ (inputs.audit == 'true') }}
      shell: pwsh
      working-directory: desktop
      run: npm audit --include=dev --audit-level=high
    - name: Type-check and build frontend
      if: inputs.test != 'true'
      shell: pwsh
      working-directory: desktop
      run: npm run build
    - name: Resolve pinned Chromium cache
      id: chromium
      if: ${{ (inputs.test == 'true') }}
      shell: pwsh
      working-directory: desktop
      run: |
        $browser = node -e "const fs = require('node:fs'); const path = require('node:path'); const root = path.dirname(require.resolve('playwright-core/package.json')); const registry = JSON.parse(fs.readFileSync(path.join(root, 'browsers.json'), 'utf8')); const browser = registry.browsers.find(item => item.name === 'chromium'); console.log(browser.browserVersion + '-' + browser.revision);"
        if ($LASTEXITCODE -ne 0 -or -not $browser) { throw 'Cannot resolve pinned Chromium.' }
        $cachePath = Join-Path $env:RUNNER_TEMP 'clarify-playwright-browsers'
        "version=$browser" >> $env:GITHUB_OUTPUT
        "path=$cachePath" >> $env:GITHUB_OUTPUT
        "PLAYWRIGHT_BROWSERS_PATH=$cachePath" >> $env:GITHUB_ENV
    - name: Restore Chromium downloads
      if: ${{ (inputs.test == 'true') }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.chromium.outputs.path }}
        key: playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.chromium.outputs.version }}-${{ hashFiles('desktop/package-lock.json') }}
    - name: Check browser downloads and install system dependencies
      if: ${{ (inputs.test == 'true') }}
      shell: pwsh
      working-directory: desktop
      run: npx --no-install playwright install --with-deps chromium
    - name: Validate Settings through shared component commands
      if: ${{ (inputs.test == 'true') }}
      shell: pwsh
      working-directory: desktop
      env:
        CLARIFY_TEST_PYTHON: ${{ inputs.python }}
        CLARIFY_TEST_BROWSER: chromium
        QT_QPA_PLATFORM: offscreen
      run: |
        $env:CLARIFY_TEST_FIXTURE = Join-Path $env:GITHUB_WORKSPACE 'tests/web_settings_fixture.py'
        & $env:CLARIFY_TEST_PYTHON ../scripts/ci.py --task settings_unit
        if ($LASTEXITCODE -ne 0) { throw 'Settings unit tests failed.' }
        & $env:CLARIFY_TEST_PYTHON ../scripts/ci.py --task settings_browser
        if ($LASTEXITCODE -ne 0) { throw 'Settings browser, bridge or boot checks failed.' }
    - name: Compile native Settings
      if: ${{ (inputs.native == 'true') }}
      shell: pwsh
      working-directory: desktop
      run: |
        cargo build --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol
        if ($LASTEXITCODE -ne 0) { throw 'Settings native build failed.' }
        New-Item -ItemType Directory -Path ../dist -Force | Out-Null
        Copy-Item src-tauri/target/release/clarify-settings.exe ../dist/clarify-settings.exe
    - name: Collect locked dependency inventory and license texts
      if: ${{ (inputs.native == 'true') }}
      shell: pwsh
      env:
        INVENTORY_PYTHON: ${{ inputs.python }}
      run: |
        & $env:INVENTORY_PYTHON scripts/settings_inventory.py --desktop desktop --output-dir dist
        if ($LASTEXITCODE -ne 0) { throw 'Settings dependency inventory failed.' }
    - name: Retain isolated Settings test evidence
      if: ${{ (always() && inputs.test == 'true') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Settings-tests-${{ github.job }}-${{ github.sha }}
        path: desktop/test-results/
        if-no-files-found: ignore
        retention-days: 7
