name: Dependency audit
on:
  workflow_call:
    inputs:
      linux-runner:
        type: string
        default: ubuntu-24.04
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  python:
    name: Python audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lock: requirements-lock-linux.txt
          - os: windows-2025
            lock: requirements-lock-windows.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - run: python scripts/install_bootstrap_tools.py --lock-file "${{ matrix.lock }}"
      - run: python -m pip install --disable-pip-version-check pip-audit -c "${{ matrix.lock }}"
      - run: python scripts/dependency_audit.py
  javascript:
    name: JavaScript audit (${{ matrix.component }})
    strategy:
      fail-fast: false
      matrix:
        component: [ci, desktop, mobile]
    runs-on: ${{ inputs.linux-runner || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
        working-directory: ${{ matrix.component }}
      - run: npm audit --include=dev --audit-level=high
        working-directory: ${{ matrix.component }}
