name: iOS validation
on:
  workflow_call: {}
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  native:
    name: Native keyboard and library tests
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Restore native test build cache
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            mobile/modules/clarify-core/.build
            ${{ runner.temp }}/ClarifyKeyboardUI
            ${{ runner.temp }}/ClarifyKeyboardUIFixture
          key: ios-tests-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-ios-26.5-${{ hashFiles('mobile/modules/clarify-core/Package.swift', 'mobile/modules/clarify-core/Package.resolved', 'mobile/modules/clarify-core/ios/**/*.swift', 'mobile/modules/clarify-core/tests/**/*.swift', 'mobile/native/keyboard/**', 'mobile/native/tests/**', 'mobile/scripts/test-keyboard-ui.cjs') }}
          restore-keys: |
            ios-tests-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-ios-26.5-
      - run: swift test --package-path modules/clarify-core
      - name: Test native keyboard and library integration
        env:
          CLARIFY_NATIVE_TESTS: "1"
          CLARIFY_IOS_UI_DERIVED_DATA: ${{ runner.temp }}/ClarifyKeyboardUI
          CLARIFY_IOS_UI_FIXTURE_ROOT: ${{ runner.temp }}/ClarifyKeyboardUIFixture
        run: node scripts/test-keyboard-ui.cjs
      - name: Retain native test results
        if: ${{ (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-native-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7
  build:
    name: Unsigned app and extensions build
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-env
      - name: Compile app and extensions without signing or upload
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Clarify.xcworkspace -scheme Clarify \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ClarifyAccount" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/ios-build.log" | xcbeautify
      - name: Retain native build timing
        if: ${{ (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-build-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
  app:
    name: Containing app UI tests
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ios-env
      - name: Test the containing app on an isolated simulator service
        run: node scripts/test-app-ui.cjs
      - name: Retain containing-app test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-app-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/test-results/app-ui/
          if-no-files-found: error
          retention-days: 7
  validate:
    name: Native tests and unsigned build
    needs:
      - native
      - build
      - app
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native tests and unsigned compilation
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          APP_RESULT: ${{ needs.app.result }}
        run: |2
            set -euo pipefail
            test "$NATIVE_RESULT" = success
            test "$BUILD_RESULT" = success
            test "$APP_RESULT" = success
