name: Isolated app animation diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed diagnostic source
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    name: Capture the first native animation wait
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
      CLARIFY_APP_UI_ANIMATION_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the reviewed diagnostic source
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
      - uses: ./.github/actions/ios-env
      - name: Observe the original app until the first animation wait
        run: node scripts/test-app-ui.cjs
      - name: Preserve diagnostic evidence after success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-animation-trace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/test-results/app-ui/
          if-no-files-found: error
          retention-days: 7
