name: Isolated keyboard activation diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact independently reviewed diagnostic source
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'jvictormaynard/clarify' && github.event_name == 'workflow_dispatch'
    runs-on: bitrise-runner-clarify-ios-validation
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      DEVELOPER_DIR: /Applications/Xcode-26.6.0.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
      CLARIFY_HOST_ACTIVATION_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the exact reviewed diagnostic branch
        working-directory: .
        env:
          REVIEWED_SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_SHA" = "$REVIEWED_SOURCE"
          test "$GITHUB_REF" = refs/heads/codex/ios-host-activation-trace-20261101
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Verify the preflight toolchain and Ruby syntax
        run: |
          xcodebuild -version
          ruby -rxcodeproj -e 'abort "Unexpected xcodeproj" unless Xcodeproj::VERSION == "1.27.0"'
          ruby -c scripts/keyboard-extension-project.rb
          node --check scripts/host-activation-trace.cjs
      - name: Trace both installed keyboard activations
        run: node scripts/test-keyboard-extension.cjs
      - name: Preserve activation failure and native trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: keyboard-activation-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/test-results/installed-keyboard-*/
          if-no-files-found: error
          retention-days: 14
