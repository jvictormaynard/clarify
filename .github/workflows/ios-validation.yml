name: Isolated Bitrise runner preflight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
        description: Exact reviewed preflight source
permissions:
  contents: read
jobs:
  preflight:
    runs-on: bitrise-runner-clarify-ios-validation
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and pinned Apple tools
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE"
          python3 - <<'PY'
          import glob, json, os, pathlib, subprocess
          candidates = sorted(set(glob.glob('/Applications/Xcode*.app')))
          selected = None
          for app in candidates:
              developer = str(pathlib.Path(app) / 'Contents/Developer')
              env = dict(os.environ, DEVELOPER_DIR=developer)
              version = subprocess.run(['xcodebuild', '-version'], env=env, capture_output=True, text=True, timeout=20)
              if version.returncode == 0 and version.stdout.splitlines()[0] == 'Xcode 26.6':
                  selected = developer
                  break
          assert selected, 'Pinned Xcode26.6 is unavailable'
          env = dict(os.environ, DEVELOPER_DIR=selected)
          runtimes = json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','--json'], env=env, text=True, timeout=30))
          runtime = next((r for r in runtimes['runtimes'] if r.get('isAvailable') and r['identifier']=='com.apple.CoreSimulator.SimRuntime.iOS-26-5'), None)
          assert runtime, 'Pinned iOS26.5 simulator runtime is unavailable'
          print(json.dumps({'developer_dir':selected,'runtime':runtime['identifier'],'distribution_signing':False,'publication':False}))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('DEVELOPER_DIR='+selected+'\n')
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Verify existing runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          swift --version
          pod --version
          ruby -rxcodeproj -e 'puts Xcodeproj::VERSION'
          command -v xcbeautify
          xcrun simctl list devices available
