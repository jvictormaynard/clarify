name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a candidate or publish an existing verified candidate
        type: choice
        options: [build-candidate, publish-candidate]
        default: build-candidate
        required: true
      channel:
        description: Final candidate channel
        type: choice
        options: [preview, stable]
        default: preview
        required: true
      source_sha:
        description: Exact source SHA (stable builds dispatch the reviewed vX.Y.Z tag)
        type: string
        required: true

      candidate_run_id:
        description: Publish only - completed successful candidate run ID
        type: string
      candidate_attempt:
        description: Publish only - exact current successful attempt
        type: string
      artifact_id:
        description: Publish only - immutable candidate artifact ID
        type: string
      artifact_digest:
        description: Publish only - sha256 digest from the candidate artifact
        type: string
      version:
        description: Publish only - exact final packaged X.Y.Z version
        type: string
      acceptance:
        description: Stable publication only - fresh candidate acceptance JSON
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: desktop-release
  queue: max
  cancel-in-progress: false

jobs:
  build_gate:
    if: github.repository == 'jvictormaynard/clarify' && github.event_name == 'workflow_dispatch' && inputs.action == 'build-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Authorize candidate creation without publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python scripts/release_candidate.py build-gate --channel "$RELEASE_CHANNEL" --source-sha "$RELEASE_SOURCE"

  build_candidate:
    needs: build_gate
    if: inputs.action == 'build-candidate'
    name: Build desktop candidate
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    environment: ${{ inputs.channel == 'stable' && 'portable-updates' || 'desktop-preview' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag on canonical main
        if: inputs.channel == 'stable'
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify main." }
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          if ($LASTEXITCODE -ne 0) { throw "The release commit must belong to main." }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-windows.txt
            requirements-lock-runtime-windows.txt

      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-windows.txt

      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-windows.txt

      - name: Check development dependency lock
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-windows.txt --allow-unsafe

      - name: Check runtime dependency lock
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-runtime-windows.txt --requirements-file requirements.txt

      - name: Check runtime pins match build lock
        run: python scripts/check_runtime_lock.py

      - name: Test preview Python contracts
        if: inputs.channel == 'preview'
        run: python scripts/run_tests.py --suite policy --suite unit --suite contract --suite integration --suite qt --suite windows --suite compatibility

      # The gate verifies exact main CI, including desktop tests and packaging.
      - name: Audit dependencies
        run: python scripts/dependency_audit.py

      - name: Compile release scripts
        run: python -m compileall -q scripts

      - name: Validate and build Settings
        uses: ./.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/python.exe
          audit: 'true'

      - name: Prepare preview inputs without an update feed
        if: inputs.channel == 'preview'
        env:
          RELEASE_SOURCE: ${{ inputs.source_sha }}
        run: python scripts/release_delivery.py preview-build --source-sha "$env:RELEASE_SOURCE"

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build.ps1 -SettingsExecutable dist\clarify-settings.exe

      - name: Generate runtime SBOM
        run: cyclonedx-py requirements requirements-lock-runtime-windows.txt --of JSON -o dist\Clarify.sbom.json

      - name: Include portable crypto attribution and OpenSSL in SBOM
        run: python scripts/portable_crypto_inventory.py --output-dir dist --bom dist/Clarify.sbom.json

      - name: Verify frozen portable replacement and recovery
        run: python scripts/test_portable_update.py

      - name: Add bundled SoX to SBOM
        run: python scripts/add_sbom_component.py --bom-file dist\Clarify.sbom.json --runtime-root extra\sox-14.4.2 --manifest scripts\sox-runtime-manifest.json

      - name: Include Settings in the release SBOM
        run: python scripts/settings_inventory.py --merge-bom dist/Clarify.sbom.json --settings-bom dist/Clarify-settings.sbom.json

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match packaged version v$version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create unsigned community assets
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Clarify.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clarify.exe" | Set-Content -Encoding ascii dist\Clarify.exe.sha256
          $soxSource = "dist\sox-14.4.2-source.tar.gz"
          & curl.exe `
            --fail `
            --location `
            --retry 3 `
            --output $soxSource `
            "https://downloads.sourceforge.net/project/sox/sox/14.4.2/sox-14.4.2.tar.gz"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download the corresponding SoX source archive."
          }
          $soxHash = (Get-FileHash $soxSource -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($soxHash -ne "b45f598643ffbd8e363ff24d61166ccec4836fea6d3888881b8df53e3bb55f6c") {
            throw "The downloaded SoX source archive did not match the expected SHA-256."
          }
          Compress-Archive `
            -Path dist\Clarify.exe, dist\Clarify.exe.sha256, dist\Clarify.sbom.json, LICENSE, THIRD_PARTY_NOTICES.md, dist\Clarify-settings-NOTICES.txt, dist\Clarify-qt-NOTICES.txt, dist\Clarify-crypto-NOTICES.txt `
            -DestinationPath dist\Clarify-windows-x64.zip `
            -Force

      - name: Recheck candidate source before signing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python scripts/release_candidate.py build-gate --channel "$env:RELEASE_CHANNEL" --source-sha "$env:RELEASE_SOURCE"

      - name: Sign portable update metadata
        if: inputs.channel == 'stable'
        env:
          CLARIFY_UPDATE_SIGNING_KEY: ${{ secrets.CLARIFY_UPDATE_SIGNING_KEY }}
        run: python scripts/create_portable_update_manifest.py --source-sha ${{ github.sha }}

      - name: Seal desktop candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python scripts/release_candidate.py seal --channel "$env:RELEASE_CHANNEL" --source-sha "$env:RELEASE_SOURCE"

      - name: Attest candidate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/*

      - name: Upload desktop candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Record candidate selector for acceptance and publication
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          $digest = $env:ARTIFACT_DIGEST
          if (-not $digest.StartsWith('sha256:')) { $digest = "sha256:$digest" }
          "Candidate run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT, artifact $env:ARTIFACT_ID, digest $digest. No release was published." >> $env:GITHUB_STEP_SUMMARY
          Get-Content candidate/Clarify-candidate.json >> $env:GITHUB_STEP_SUMMARY

  publish_candidate:
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && inputs.action == 'publish-candidate' &&
      vars.CLARIFY_RELEASE_PUBLICATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    name: Publish existing desktop candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-publication
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    steps:
      - name: Check out trusted publisher (never candidate build inputs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify and publish the existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          CANDIDATE_ARTIFACT: ${{ inputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ inputs.artifact_digest }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_ACCEPTANCE: ${{ inputs.acceptance }}
          CLARIFY_RELEASE_PUBLICATION_ENABLED: ${{ vars.CLARIFY_RELEASE_PUBLICATION_ENABLED }}
        run: >-
          python scripts/release_candidate.py publish
          --channel "$RELEASE_CHANNEL" --source-sha "$RELEASE_SOURCE"
          --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT"
          --artifact-id "$CANDIDATE_ARTIFACT" --artifact-digest "$CANDIDATE_DIGEST"
          --version "$CANDIDATE_VERSION"
