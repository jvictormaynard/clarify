name: iOS TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash:
    if: github.repository == 'jvictormaynard/clarify' && github.ref == 'refs/heads/codex/apple-build84-crash-diagnostic'
    runs-on: ubuntu-latest
    environment: ios-testflight
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Read the reported crash and retain only stack diagnostics
        env:
          ASC_KEY: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const now = Math.floor(Date.now()/1000);
          const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const unsigned = b64({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+b64({iss:process.env.ASC_ISSUER,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
          const jwt = unsigned+'.'+crypto.sign('sha256',Buffer.from(unsigned),{key:process.env.ASC_KEY,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const report = {crash:'AGuLfY9WDOwLp1I9KyhX22k',checkedAt:new Date().toISOString()};
          const response = await fetch('https://api.appstoreconnect.apple.com/v1/betaFeedbackCrashSubmissions/AGuLfY9WDOwLp1I9KyhX22k/crashLog',{headers:{Authorization:'Bearer '+jwt},redirect:'error',signal:AbortSignal.timeout(30000)});
          report.httpStatus=response.status;
          const body = await response.json();
          if (!response.ok) report.errorCodes=(body.errors||[]).map(e=>e.code);
          else {
            const raw = body.data?.attributes?.logText;
            report.logAvailable=typeof raw==='string';
            report.attributeNames=Object.keys(body.data?.attributes||{});
            if(typeof raw==='string') {
              let parsed;
              try { parsed=JSON.parse(raw); } catch { try {parsed=JSON.parse(raw.slice(raw.indexOf('\n')+1));}catch{} }
              if(parsed && parsed.threads) {
                report.format='ips-json';
                report.exception={type:parsed.exception?.type,signal:parsed.exception?.signal};
                report.termination={namespace:parsed.termination?.namespace,code:parsed.termination?.code};
                report.build=parsed.bundleInfo?.CFBundleVersion;
                report.threads=parsed.threads.map((t,index)=>({index,triggered:t.triggered,frames:(t.frames||[]).slice(0,100).map(f=>({image:parsed.usedImages?.[f.imageIndex]?.name,symbol:f.symbol,imageOffset:f.imageOffset}))}));
              } else {
                report.format='crash-text';
                report.lines=raw.split('\n').filter(l=>/^(Version:|OS Version:|Exception Type:|Exception Codes:|Termination Reason:|Triggered by Thread:|Thread \d+ Crashed:|Last Exception Backtrace:)/.test(l)||/^\d+\s+[A-Za-z0-9_.+-]+\s+0x[0-9a-fA-F]+/.test(l)).slice(0,450);
                const init=raw.match(/Use of unimplemented initializer[^\n]{0,200}/);
                if(init)report.unimplementedInitializer=init[0].replace(/[0-9a-f]{8}-[0-9a-f-]{27,}/gi,'[redacted]');
              }
            }
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/crash-summary.json',JSON.stringify(report,null,2));
          console.log('Crash API status '+report.httpStatus+'; log available '+!!report.logAvailable);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clarify-crash-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/crash-summary.json
          retention-days: 1
          if-no-files-found: error
