name: iOS installed startup diagnostic (no signing)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarify-installed-startup-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe frozen build40 startup without Apple credentials
    if: github.repository == 'jvictormaynard/clarify'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - name: Check out the diagnostic controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - name: Check out the unchanged publication baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 678772aadda5d5eec78bd8f2b818635a7657ba90
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: baseline/mobile/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare a separate observation copy and its source manifest
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/clarify-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python observer/mobile/scripts/diagnose-installed-startup.py \
            --source "$GITHUB_WORKSPACE/baseline" --probe "$probe" \
            --evidence "$GITHUB_WORKSPACE/diagnostic-evidence"
          echo "PROBE_ROOT=$probe" >> "$GITHUB_ENV"
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install the baseline's locked dependencies
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: npm ci
      - name: Check prompts, types, lint and JavaScript contracts
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: npm run check
      - name: Check Expo configuration
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: npx --yes expo-doctor
      - name: Generate the native project
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: pod install --project-directory=ios
      - name: Preserve the original app-navigation precondition
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: node scripts/test-app-ui.cjs
      - name: Preserve the original Swift-contract precondition
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: npm run test:native
      - name: Preserve the original UIKit precondition
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        env:
          CLARIFY_NATIVE_TESTS: '1'
        run: node scripts/test-keyboard-ui.cjs
      - name: Observe the installed extension with unchanged assertions and deadlines
        working-directory: ${{ env.PROBE_ROOT }}/mobile
        run: node scripts/test-keyboard-extension.cjs
      - name: Verify that the frozen baseline was not modified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-evidence
          git -C baseline rev-parse HEAD > diagnostic-evidence/baseline-head.txt
          grep -Fx 678772aadda5d5eec78bd8f2b818635a7657ba90 diagnostic-evidence/baseline-head.txt
          git -C baseline diff --exit-code
          if [ -n "${PROBE_ROOT:-}" ] && [ -e "$PROBE_ROOT/.git" ]; then
            git -C "$PROBE_ROOT" diff --name-only > diagnostic-evidence/probe-modified-paths.txt
          fi
      - name: Preserve diagnostic evidence after success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-startup-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/
            ${{ env.PROBE_ROOT }}/mobile/test-results/keyboard-ui.zip
            ${{ env.PROBE_ROOT }}/mobile/test-results/app-ui/
            !${{ env.PROBE_ROOT }}/mobile/test-results/app-ui/AppFlow.xcresult/Staging/**
            ${{ env.PROBE_ROOT }}/mobile/test-results/installed-keyboard-*
          if-no-files-found: error
          retention-days: 7
