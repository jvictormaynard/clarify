name: iOS 39 installed keyboard diagnosis (tests only)

on:
  workflow_dispatch:
    inputs:
      tests_only:
        description: Confirm execution without signing or upload
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  installed_keyboard:
    if: inputs.tests_only
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.1
      - name: Record exact source and tools
        run: |
          set -euo pipefail
          mkdir -p test-results/diagnosis
          git rev-parse HEAD HEAD:mobile > test-results/diagnosis/source.txt
          git ls-files -z native modules scripts | xargs -0 shasum -a 256 > test-results/diagnosis/source-sha256.txt
          xcodebuild -version | tee test-results/diagnosis/xcode.txt
          xcrun simctl list devices available --json > test-results/diagnosis/devices-before.json
          xcrun simctl list runtimes --json > test-results/diagnosis/runtimes.json
          ruby -rxcodeproj -e 'puts Xcodeproj::VERSION'
      - name: Check locked mobile JavaScript contracts, types and lint
        run: |
          set -euo pipefail
          npm ci
          npm run check
          node --check scripts/test-keyboard-extension.cjs
          ruby -c scripts/keyboard-extension-project.rb
          xcrun swiftc -frontend -parse native/tests/KeyboardExtensionTests.swift
          xcrun swiftc -frontend -parse native/tests/KeyboardExtensionHost.swift
      - name: Check Swift contracts
        run: npm run test:native
      - name: Run unchanged installed typing and twice activation on fresh simulator
        run: |
          set -euo pipefail
          node scripts/test-keyboard-extension.cjs 2>&1 | tee test-results/diagnosis/installed-keyboard.log
      - name: Export result summaries
        if: always()
        run: |
          for result in test-results/installed-keyboard-*/KeyboardExtension.xcresult; do
            if [[ -d "$result" ]]; then
              xcrun xcresulttool get test-results summary --path "$result" > "${result%/*}/xcresult-summary.json"
              xcrun xcresulttool get test-results tests --path "$result" > "${result%/*}/xcresult-tests.json"
            fi
          done
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios39-installed-keyboard-ax-${{ github.sha }}
          path: mobile/test-results/
          if-no-files-found: error
          retention-days: 7
