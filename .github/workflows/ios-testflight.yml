name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source SHA (required for signed upload on an ios/v tag)
        type: string
        default: ''
      mode:
        description: Validation, internal TestFlight upload, read-only status or existing-build availability
        type: choice
        options: [validate, testflight, status, availability]
        default: validate
        required: true
      extension_diagnostic:
        description: Also enforce the unresolved opening-height diagnostic (tests only)
        type: boolean
        default: false
      app_ui_compact_only:
        description: Diagnose only the compact app UI profile (tests only; incomplete acceptance)
        type: boolean
        default: false
      short_dictation_acceptance:
        description: Validate synthetic short speech with the live Groq client
        type: boolean
        default: false
      snippets_acceptance:
        description: Validate snippets with the live native client and temporary test accounts
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: clarify-ios-${{ inputs.mode == 'validate' && github.run_id || 'testflight' }}
  queue: max
  cancel-in-progress: false

jobs:
  release_gate:
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      (inputs.mode == 'testflight' || inputs.mode == 'availability')
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify reviewed mobile source before signing or upload
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          flags=()
          if [ "$RELEASE_MODE" = availability ]; then flags+=(--availability-only); fi
          python scripts/release_delivery.py verify --component mobile --source-sha "$RELEASE_SOURCE" --tag "$RELEASE_TAG" "${flags[@]}"

  availability:
    name: Verify the uploaded TestFlight build
    needs: release_gate
    if: >-
      always() && github.repository == 'jvictormaynard/clarify' &&
      needs.release_gate.outputs.result == 'availability'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - name: Verify processing and publish to the existing internal group
        working-directory: mobile
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: node scripts/publish-testflight.cjs
      - name: Preserve TestFlight availability evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clarify-testflight-${{ github.sha }}
          path: mobile/test-results/testflight-availability.json
          if-no-files-found: error
          retention-days: 90
  publish:
    name: Test, sign and upload iOS
    needs: release_gate
    if: >-
      always() && github.repository == 'jvictormaynard/clarify' &&
      (inputs.mode == 'validate' ||
       (inputs.mode == 'testflight' && needs.release_gate.outputs.result == 'publish'))
    runs-on: macos-26
    timeout-minutes: 120
    environment: ${{ inputs.mode == 'testflight' && 'ios-testflight' || 'ios-validation' }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Recheck upload history before signing or retrying
        id: resume
        if: ${{ inputs.mode == 'testflight' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_delivery.py verify --component mobile --source-sha "$RELEASE_SOURCE" --tag "$RELEASE_TAG"
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci
      - name: Check prompts, types, lint and JavaScript contracts
        if: ${{ inputs.mode == 'testflight' || !inputs.extension_diagnostic }}
        run: npm run check
      - name: Check Expo configuration
        if: ${{ inputs.mode == 'testflight' || !inputs.extension_diagnostic }}
        run: npx --yes expo-doctor
      - name: Generate native project
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Verify patched native source targets
        run: node scripts/verify-react-native-source.cjs
      - name: Test Swift contracts
        if: ${{ inputs.mode == 'testflight' || !inputs.extension_diagnostic }}
        run: npm run test:native
      - name: Test first launch and navigation in the containing app
        if: ${{ inputs.mode == 'testflight' || !inputs.extension_diagnostic }}
        env:
          CLARIFY_APP_UI_COMPACT_ONLY: ${{ inputs.mode == 'validate' && inputs.app_ui_compact_only }}
        run: node scripts/test-app-ui.cjs
      - name: Validate short speech with the live mobile client
        if: ${{ inputs.short_dictation_acceptance }}
        env:
          CLARIFY_SHORT_DICTATION_ACCEPTANCE: ${{ secrets.CLARIFY_SHORT_DICTATION_ACCEPTANCE }}
        run: node scripts/test-short-dictation.cjs
      - name: Validate snippets with the live mobile client
        if: inputs.snippets_acceptance
        env:
          CLARIFY_SNIPPETS_ACCEPTANCE: ${{ secrets.CLARIFY_SNIPPETS_ACCEPTANCE }}
        run: node scripts/test-snippets-acceptance.cjs
      - name: Test keyboard on iPhone simulator
        if: ${{ inputs.mode == 'testflight' || !inputs.extension_diagnostic }}
        env:
          CLARIFY_NATIVE_TESTS: '1'
        run: node scripts/test-keyboard-ui.cjs
      - name: Test installed keyboard typing and activation
        env:
          STRICT_OPENING_HEIGHT: ${{ inputs.mode == 'validate' && inputs.extension_diagnostic }}
        run: |
          if [[ "$STRICT_OPENING_HEIGHT" == 'true' ]]; then
            node scripts/test-keyboard-extension.cjs --check-opening-height
          else
            node scripts/test-keyboard-extension.cjs
          fi
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clarify-keyboard-tests-${{ github.sha }}
          path: |
            mobile/test-results/keyboard-ui.zip
            mobile/test-results/app-ui/
            !mobile/test-results/app-ui/AppFlow.xcresult/Staging/**
            mobile/test-results/installed-keyboard-*
            mobile/test-results/short-dictation-acceptance.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Build the containing app without signing
        if: ${{ inputs.mode == 'validate' }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Clarify.xcworkspace -scheme Clarify \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ClarifyValidation" \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify
      - name: Install existing Apple signing credentials
        if: ${{ inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish' }}
        env:
          CLARIFY_IOS_CERTIFICATE_BASE64: ${{ secrets.CLARIFY_IOS_CERTIFICATE_BASE64 }}
          CLARIFY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CLARIFY_IOS_CERTIFICATE_PASSWORD }}
          CLARIFY_IOS_PROFILES_GZIP_BASE64: ${{ secrets.CLARIFY_IOS_PROFILES_GZIP_BASE64 }}
        run: python3 scripts/ios-signing.py install
      - name: Apply signing to generated app and extension targets
        if: ${{ inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish' }}
        run: ruby scripts/ios-signing.rb
      - name: Archive and export signed IPA
        if: ${{ inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish' }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Clarify.xcworkspace -scheme Clarify \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Clarify.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ClarifyDerivedData" archive 2>&1 | tee "$RUNNER_TEMP/clarify-archive.log" | xcbeautify
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Clarify.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/clarify-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/clarify-export" 2>&1 | tee "$RUNNER_TEMP/clarify-export.log" | xcbeautify
      - name: Verify signed app and both extensions
        if: ${{ inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish' }}
        run: python3 scripts/verify-ios-ipa.py "$RUNNER_TEMP/clarify-export/Clarify.ipa"
      - name: Upload directly to App Store Connect
        if: ${{ inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish' }}
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/clarify-upload/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$RUNNER_TEMP/clarify-upload" "$key_dir"
          printf '%s' "$CLARIFY_ASC_KEY_P8" > "$key_dir/AuthKey_${CLARIFY_ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${CLARIFY_ASC_KEY_ID}.p8"
          trap 'rm -rf "$key_dir"' EXIT
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timezone
          output = Path(os.environ['RUNNER_TEMP']) / 'clarify-export'
          verification = json.loads((output / 'verification.json').read_text())
          assert hashlib.sha256((output / 'Clarify.ipa').read_bytes()).hexdigest() == verification['sha256'], 'Verified IPA changed before upload'
          receipt = {'state': 'started', 'source': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ipa_sha256': verification['sha256'], 'started_utc': datetime.now(timezone.utc).isoformat()}
          with (output / 'upload-receipt.json').open('x') as stream:
              json.dump(receipt, stream)
          PY
          set +e
          API_PRIVATE_KEYS_DIR="$key_dir" xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/clarify-export/Clarify.ipa" \
            --apiKey "$CLARIFY_ASC_KEY_ID" --apiIssuer "$CLARIFY_ASC_ISSUER_ID"
          upload_exit=$?
          set -e
          UPLOAD_EXIT="$upload_exit" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path(os.environ['RUNNER_TEMP']) / 'clarify-export/upload-receipt.json'
          receipt = json.loads(path.read_text())
          receipt.update(state='confirmed' if os.environ['UPLOAD_EXIT'] == '0' else 'uncertain', upload_exit=int(os.environ['UPLOAD_EXIT']), finished_utc=datetime.now(timezone.utc).isoformat())
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          exit "$upload_exit"
      - name: Preserve verified IPA and checksum
        if: success() && inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clarify-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/clarify-export/Clarify.ipa
            ${{ runner.temp }}/clarify-export/Clarify.ipa.sha256
            ${{ runner.temp }}/clarify-export/verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify processing and publish to the existing internal group
        if: success() && inputs.mode == 'testflight'
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: node scripts/publish-testflight.cjs
      - name: Seal TestFlight candidate evidence
        if: success() && inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish'
        working-directory: .
        run: |
          cp mobile/test-results/testflight-availability.json "$RUNNER_TEMP/clarify-export/testflight-availability.json"
          python3 scripts/app_store_handoff.py seal-evidence \
            --source-sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-directory "$RUNNER_TEMP/clarify-export" --output "$RUNNER_TEMP/testflight-candidate"
      - name: Preserve TestFlight candidate evidence
        id: candidate
        if: success() && inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clarify-testflight-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-candidate/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Record the production-identity candidate selector
        if: success() && inputs.mode == 'testflight' && steps.resume.outputs.result == 'publish'
        env:
          CANDIDATE_ARTIFACT: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: echo "TestFlight candidate run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT, artifact $CANDIDATE_ARTIFACT, digest sha256:${CANDIDATE_DIGEST#sha256:}. App Store submission remains manual." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve signing and upload evidence
        if: always() && inputs.mode == 'testflight'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: clarify-ios-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clarify-archive.log
            ${{ runner.temp }}/clarify-export.log
            ${{ runner.temp }}/clarify-export/verification.json
            ${{ runner.temp }}/clarify-export/upload-receipt.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove temporary signing credentials
        if: always() && inputs.mode == 'testflight'
        run: python3 scripts/ios-signing.py clean
  apple_status:
    if: ${{ inputs.mode == 'status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read App Store Connect build availability
        env:
          ASC_KEY: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        shell: bash
        run: |
          node <<'JS'
          const { sign } = require('node:crypto');
          const encode = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const body = encode({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }) + '.' +
            encode({ iss: process.env.ASC_ISSUER, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' });
          const signature = sign('sha256', Buffer.from(body), { key: process.env.ASC_KEY, dsaEncoding: 'ieee-p1363' });
          const token = body + '.' + signature.toString('base64url');
          async function get(path) {
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + path, { headers: { Authorization: 'Bearer ' + token } });
            if (!response.ok) throw new Error('Apple status request failed: HTTP ' + response.status);
            return response.json();
          }
          (async () => {
            const builds = await get('builds?filter[app]=6820869157&sort=-uploadedDate&limit=10&include=preReleaseVersion,buildBetaDetail');
            console.log(JSON.stringify({ checkedAt: new Date().toISOString(), builds }, null, 2));
            const groups = await get('betaGroups?filter[app]=6820869157&limit=100');
            for (const group of groups.data.filter(item => item.attributes.isInternalGroup)) {
              group.builds = (await get('betaGroups/' + group.id + '/builds?limit=100')).data.map(item => item.id);
              group.existingTesters = (await get('betaGroups/' + group.id + '/relationships/betaTesters?limit=200')).data.length;
            }
            console.log(JSON.stringify({ groups }, null, 2));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
