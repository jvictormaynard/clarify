name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source SHA (required for signed upload on an ios/v tag)
        type: string
        default: ''
      tests_only:
        description: Run checks without signing or upload
        type: boolean
        default: false
      extension_diagnostic:
        description: Also enforce the unresolved opening-height diagnostic (tests only)
        type: boolean
        default: false
      status_only:
        description: Read Apple build and group status without building or uploading
        type: boolean
        default: false
      short_dictation_acceptance:
        description: Validate synthetic short speech with the live Groq client
        type: boolean
        default: false
      snippets_acceptance:
        description: Validate snippets with the live native client and temporary test accounts
        type: boolean
        default: false
      availability_only:
        description: Complete internal TestFlight delivery of the already uploaded build
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: clarify-ios-${{ inputs.tests_only && github.run_id || 'testflight' }}
  queue: max
  cancel-in-progress: false

jobs:
  release_gate:
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      !inputs.tests_only && !inputs.status_only && !inputs.availability_only
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify reviewed mobile source before signing or upload
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_delivery.py verify --component mobile --source-sha "$RELEASE_SOURCE" --tag "$RELEASE_TAG"

  availability:
    name: Verify the uploaded TestFlight build
    needs: release_gate
    if: >-
      always() && !inputs.status_only && !inputs.tests_only &&
      (inputs.availability_only || needs.release_gate.outputs.result == 'availability')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.1
      - name: Verify processing and publish to the existing internal group
        working-directory: mobile
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: node scripts/publish-testflight.cjs
      - name: Preserve TestFlight availability evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clarify-testflight-${{ github.sha }}
          path: mobile/test-results/testflight-availability.json
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Test, sign and upload iOS
    needs: release_gate
    if: >-
      always() && github.repository == 'jvictormaynard/clarify' &&
      !inputs.availability_only && !inputs.status_only &&
      (inputs.tests_only || needs.release_gate.outputs.result == 'publish')
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLARIFY_IOS_RUNTIME: iOS-26-5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Recheck upload history before signing or retrying
        id: resume
        if: ${{ !inputs.tests_only }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_delivery.py verify --component mobile --source-sha "$RELEASE_SOURCE" --tag "$RELEASE_TAG"
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci
      - name: Check prompts, types, lint and JavaScript contracts
        if: ${{ !inputs.tests_only || !inputs.extension_diagnostic }}
        run: npm run check
      - name: Check Expo configuration
        if: ${{ !inputs.tests_only || !inputs.extension_diagnostic }}
        run: npx --yes expo-doctor
      - name: Generate native project
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Test first launch and navigation in the containing app
        if: ${{ !inputs.tests_only || !inputs.extension_diagnostic }}
        run: node scripts/test-app-ui.cjs
      - name: Test Swift contracts
        if: ${{ !inputs.tests_only || !inputs.extension_diagnostic }}
        run: npm run test:native
      - name: Validate short speech with the live mobile client
        if: ${{ inputs.short_dictation_acceptance }}
        env:
          CLARIFY_SHORT_DICTATION_ACCEPTANCE: ${{ secrets.CLARIFY_SHORT_DICTATION_ACCEPTANCE }}
        run: node scripts/test-short-dictation.cjs
      - name: Validate snippets with the live mobile client
        if: inputs.snippets_acceptance
        env:
          CLARIFY_SNIPPETS_ACCEPTANCE: ${{ secrets.CLARIFY_SNIPPETS_ACCEPTANCE }}
        run: node scripts/test-snippets-acceptance.cjs
      - name: Test keyboard on iPhone simulator
        if: ${{ !inputs.tests_only || !inputs.extension_diagnostic }}
        env:
          CLARIFY_NATIVE_TESTS: '1'
        run: node scripts/test-keyboard-ui.cjs
      - name: Test installed keyboard typing and activation
        env:
          STRICT_OPENING_HEIGHT: ${{ inputs.tests_only && inputs.extension_diagnostic }}
        run: |
          if [[ "$STRICT_OPENING_HEIGHT" == 'true' ]]; then
            node scripts/test-keyboard-extension.cjs --check-opening-height
          else
            node scripts/test-keyboard-extension.cjs
          fi
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clarify-keyboard-tests-${{ github.sha }}
          path: |
            mobile/test-results/keyboard-ui.zip
            mobile/test-results/app-ui/
            !mobile/test-results/app-ui/AppFlow.xcresult/Staging/**
            mobile/test-results/installed-keyboard-*
            mobile/test-results/short-dictation-acceptance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the containing app without signing
        if: ${{ inputs.tests_only }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Clarify.xcworkspace -scheme Clarify \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ClarifyValidation" \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify
      - name: Install existing Apple signing credentials
        if: ${{ !inputs.tests_only && steps.resume.outputs.result == 'publish' }}
        env:
          CLARIFY_IOS_CERTIFICATE_BASE64: ${{ secrets.CLARIFY_IOS_CERTIFICATE_BASE64 }}
          CLARIFY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CLARIFY_IOS_CERTIFICATE_PASSWORD }}
          CLARIFY_IOS_PROFILES_GZIP_BASE64: ${{ secrets.CLARIFY_IOS_PROFILES_GZIP_BASE64 }}
        run: python3 scripts/ios-signing.py install
      - name: Apply signing to generated app and extension targets
        if: ${{ !inputs.tests_only && steps.resume.outputs.result == 'publish' }}
        run: ruby scripts/ios-signing.rb
      - name: Archive and export signed IPA
        if: ${{ !inputs.tests_only && steps.resume.outputs.result == 'publish' }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Clarify.xcworkspace -scheme Clarify \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Clarify.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ClarifyDerivedData" archive | xcbeautify
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Clarify.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/clarify-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/clarify-export" | xcbeautify
      - name: Verify signed app and both extensions
        if: ${{ !inputs.tests_only && steps.resume.outputs.result == 'publish' }}
        run: python3 scripts/verify-ios-ipa.py "$RUNNER_TEMP/clarify-export/Clarify.ipa"
      - name: Upload directly to App Store Connect
        if: ${{ !inputs.tests_only && steps.resume.outputs.result == 'publish' }}
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/clarify-upload/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$RUNNER_TEMP/clarify-upload" "$key_dir"
          printf '%s' "$CLARIFY_ASC_KEY_P8" > "$key_dir/AuthKey_${CLARIFY_ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${CLARIFY_ASC_KEY_ID}.p8"
          API_PRIVATE_KEYS_DIR="$key_dir" xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/clarify-export/Clarify.ipa" \
            --apiKey "$CLARIFY_ASC_KEY_ID" --apiIssuer "$CLARIFY_ASC_ISSUER_ID"
      - name: Preserve verified IPA and checksum
        if: success() && !inputs.tests_only && steps.resume.outputs.result == 'publish'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clarify-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/clarify-export/Clarify.ipa
            ${{ runner.temp }}/clarify-export/Clarify.ipa.sha256
            ${{ runner.temp }}/clarify-export/verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify processing and publish to the existing internal group
        if: success() && !inputs.tests_only
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: node scripts/publish-testflight.cjs
      - name: Preserve TestFlight availability evidence
        if: success() && !inputs.tests_only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: clarify-testflight-${{ github.sha }}
          path: mobile/test-results/testflight-availability.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always() && !inputs.tests_only
        run: python3 scripts/ios-signing.py clean
  apple_status:
    if: ${{ inputs.status_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read complete App Store Connect reservation state (GET only)
        env:
          ASC_KEY: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        shell: bash
        run: |
          node <<'JS'
          'use strict';
          const { sign } = require('node:crypto');
          const { writeFileSync } = require('node:fs');
          const app = '6820869157';
          const origin = 'https://api.appstoreconnect.apple.com';
          const encode = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const report = {
            app, method: 'GET', started_at: new Date().toISOString(),
            source_sha: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID,
            source_ref: process.env.GITHUB_REF, queries: [], collections: {}, errors: [],
            apple_queries_complete: false,
          };
          const fields = {
            builds: ['version', 'uploadedDate', 'expired', 'processingState'],
            preReleaseVersions: ['version', 'platform'],
            buildBetaDetails: ['internalBuildState', 'externalBuildState'],
            buildUploads: ['cfBundleShortVersionString', 'cfBundleVersion', 'createdDate', 'uploadedDate', 'platform'],
            appStoreVersions: ['versionString', 'platform', 'appStoreState', 'appVersionState', 'createdDate'],
            appStoreVersionSubmissions: [],
            reviewSubmissions: ['platform', 'state', 'submittedDate'],
            reviewSubmissionItems: ['state'],
            betaAppReviewSubmissions: ['betaReviewState', 'submittedDate'],
            betaGroups: ['name', 'isInternalGroup', 'hasAccessToAllBuilds'],
            betaTesters: [],
          };
          function safeResource(item) {
            if (!item || typeof item.type !== 'string' || typeof item.id !== 'string') {
              throw new Error('Invalid Apple resource');
            }
            const attributes = {};
            for (const key of fields[item.type] || []) {
              if (Object.hasOwn(item.attributes || {}, key)) attributes[key] = item.attributes[key];
            }
            if (item.type === 'buildUploads') attributes.state = item.attributes?.state?.state;
            const relationships = {};
            for (const key of ['build', 'preReleaseVersion', 'buildBetaDetail', 'appStoreVersion',
              'appStoreVersionSubmission', 'appStoreVersionForReview', 'betaAppReviewSubmission']) {
              if (Object.hasOwn(item.relationships || {}, key)) {
                relationships[key] = item.relationships[key].data;
              }
            }
            return { type: item.type, id: item.id, attributes, relationships };
          }
          async function get(path) {
            const url = new URL(path, origin);
            if (url.origin !== origin || !url.pathname.startsWith('/v1/') || url.username || url.password) {
              throw new Error('Rejected Apple URL');
            }
            const now = Math.floor(Date.now() / 1000);
            const body = encode({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }) + '.' +
              encode({ iss: process.env.ASC_ISSUER, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' });
            const signature = sign('sha256', Buffer.from(body), { key: process.env.ASC_KEY, dsaEncoding: 'ieee-p1363' });
            const token = body + '.' + signature.toString('base64url');
            const entry = { url: url.href, method: 'GET', checked_at: new Date().toISOString() };
            report.queries.push(entry);
            const response = await fetch(url, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { Authorization: 'Bearer ' + token },
            });
            entry.status = response.status;
            if (!response.ok) throw new Error('Apple GET failed: HTTP ' + response.status + ' at ' + url.pathname);
            return response.json();
          }
          async function all(name, path) {
            const result = { complete: false, pages: 0, data: [], included: [], totals: [] };
            report.collections[name] = result;
            const seen = new Set();
            while (path) {
              const absolute = new URL(path, origin).href;
              if (seen.has(absolute) || seen.size >= 500) throw new Error('Invalid Apple pagination: ' + name);
              seen.add(absolute);
              const page = await get(absolute);
              if (!Array.isArray(page.data) || !page.links || !Object.hasOwn(page.links, 'self')) {
                throw new Error('Invalid Apple collection: ' + name);
              }
              result.pages++;
              result.data.push(...page.data.map(safeResource));
              result.included.push(...(page.included || []).map(safeResource));
              if (page.meta?.paging?.total !== undefined) result.totals.push(page.meta.paging.total);
              path = page.links.next;
              if (path !== undefined && path !== null && typeof path !== 'string') {
                throw new Error('Invalid Apple next link: ' + name);
              }
            }
            if (new Set(result.data.map(item => item.type + '/' + item.id)).size !== result.data.length ||
                result.totals.some(total => total !== result.data.length)) {
              throw new Error('Apple collection count changed or is incomplete: ' + name);
            }
            result.complete = true;
            return result;
          }
          async function check(name, fn) {
            try { return await fn(); }
            catch (error) {
              // Never log response bodies, signing material, JWTs or request headers.
              const message = error.message.startsWith('Apple ') || error.message.startsWith('Invalid Apple') ||
                error.message === 'Rejected Apple URL' ? error.message : 'Request or signing failure';
              report.errors.push({ name, message });
              return null;
            }
          }
          (async () => {
            const builds = await check('builds', () => all('builds',
              '/v1/builds?filter[app]=' + app + '&limit=200&include=preReleaseVersion,buildBetaDetail'));
            await check('uploads', () => all('uploads',
              '/v1/apps/' + app + '/buildUploads?limit=200&include=build'));
            await check('appStoreVersions', () => all('appStoreVersions',
              '/v1/apps/' + app + '/appStoreVersions?limit=200&include=build,appStoreVersionSubmission'));
            const reviews = await check('reviewSubmissions', () => all('reviewSubmissions',
              '/v1/apps/' + app + '/reviewSubmissions?limit=200&include=appStoreVersionForReview'));
            for (const review of reviews?.data || []) {
              await check('reviewItems:' + review.id, () => all('reviewItems:' + review.id,
                '/v1/reviewSubmissions/' + encodeURIComponent(review.id) + '/items?limit=200&include=appStoreVersion'));
            }
            if (builds) {
              for (let index = 0; index < builds.data.length; index += 100) {
                const ids = builds.data.slice(index, index + 100).map(item => item.id).join(',');
                await check('betaReviews:' + index, () => all('betaReviews:' + index,
                  '/v1/betaAppReviewSubmissions?filter[build]=' + encodeURIComponent(ids) + '&limit=200&include=build'));
              }
            }
            const groups = await check('groups', () => all('groups', '/v1/betaGroups?filter[app]=' + app + '&limit=200'));
            for (const group of groups?.data.filter(item => item.attributes.isInternalGroup) || []) {
              await check('groupBuilds:' + group.id, () => all('groupBuilds:' + group.id,
                '/v1/betaGroups/' + encodeURIComponent(group.id) + '/builds?limit=200'));
              await check('groupTesters:' + group.id, () => all('groupTesters:' + group.id,
                '/v1/betaGroups/' + encodeURIComponent(group.id) + '/relationships/betaTesters?limit=200'));
            }
            const versions = new Map();
            for (const collection of Object.values(report.collections)) {
              for (const item of [...collection.data, ...collection.included]) {
                if (item.type === 'appStoreVersions') versions.set(item.id, item);
              }
            }
            report.appStoreVersionBuilds = [];
            for (const id of versions.keys()) {
              await check('appStoreVersionBuild:' + id, async () => {
                const value = await get('/v1/appStoreVersions/' + encodeURIComponent(id) + '/build');
                if (!Object.hasOwn(value, 'data')) throw new Error('Invalid Apple version build');
                report.appStoreVersionBuilds.push({ version_id: id, build: value.data === null ? null : safeResource(value.data) });
              });
            }
            report.apple_queries_complete = report.errors.length === 0 &&
              Object.values(report.collections).every(value => value.complete);
            report.finished_at = new Date().toISOString();
            writeFileSync('apple-reservation-report.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
            if (!report.apple_queries_complete) process.exitCode = 1;
          })().catch(() => { console.error('Apple diagnostic failed before report completion'); process.exitCode = 1; });
          JS
      - name: Preserve read-only Apple reservation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-reservation-${{ github.run_id }}
          path: apple-reservation-report.json
          if-no-files-found: error
          retention-days: 7
