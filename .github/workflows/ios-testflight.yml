# One-time internal prototype release. This branch is not for merge to main.
# User authorized skipped repeat CI tests; admission repair requested on 2026-11-09. Signing and Apple gates remain.
name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable build 84 source
        required: true
        type: string
      mode:
        description: One-time internal prototype publication
        required: true
        type: choice
        options: [testflight]
        default: testflight
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: clarify-ios-testflight
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    name: Archive, sign and publish prototype build 84
    if: github.repository == 'jvictormaynard/clarify' && github.ref == 'refs/tags/ios/v0.14.2-build84' && inputs.source_sha == github.sha && inputs.mode == 'testflight'
    runs-on: ${{ vars.CLARIFY_IOS_RUNNER == 'bitrise' && 'bitrise-runner-clarify-ios-validation' || 'macos-26' }}
    timeout-minutes: 120
    environment: ios-testflight
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: ${{ vars.CLARIFY_IOS_RUNNER == 'bitrise' && '/Applications/Xcode-26.6.0.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Bind the one-time internal release and record skipped checks
        working-directory: .
        env:
          RELEASE_SOURCE: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/ios/v0.14.2-build84
          test "$GITHUB_SHA" = "$RELEASE_SOURCE"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse 'refs/tags/ios/v0.14.2-build84^{commit}')" = "$GITHUB_SHA"
          git merge-base --is-ancestor 985404c25b573c6550bd23d85ced24041e7d2ba9 "$GITHUB_SHA"
          git merge-base --is-ancestor d38ec0784bd1a89155da2a6bb72f1de956c6302b "$GITHUB_SHA"
          git diff --exit-code d38ec0784bd1a89155da2a6bb72f1de956c6302b HEAD -- mobile/native/keyboard/KeyboardViewController.swift mobile/native/tests/KeyboardUITests.swift mobile/native/keyboard/HostActivation.swift mobile/native/keyboard/KBHostArbiterHook.h mobile/native/keyboard/KBHostArbiterHook.m
          git diff --name-only -z 985404c25b573c6550bd23d85ced24041e7d2ba9 d38ec0784bd1a89155da2a6bb72f1de956c6302b | xargs -0 git diff --exit-code d38ec0784bd1a89155da2a6bb72f1de956c6302b HEAD --
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-testflight.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/prior-release-runs.json"
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const runs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prior-release-runs.json'));
          assert.equal(runs.total_count, 1, 'Do not retry an upload without resolving its history');
          assert.equal(String(runs.workflow_runs[0].id), process.env.GITHUB_RUN_ID);
          const config = require('./mobile/app.json').expo;
          assert.equal(config.version, '0.14.2');
          assert.equal(config.ios.buildNumber, '84');
          fs.mkdirSync('mobile/test-results', {recursive: true});
          fs.writeFileSync('mobile/test-results/testflight-testing-scope.json', JSON.stringify({
            source: process.env.GITHUB_SHA, internalTesting: true,
            authorization: 'User requested compatibility with current main, TestFlight publication, and no repeat CI tests on 2026-11-08.',
            compatibilityBase: '985404c25b573c6550bd23d85ced24041e7d2ba9',
            priorFeatureCI: {source: '3218fdd902cb7b65f931b15563d352b3c7c7c005', run: 41998469412},
            priorMainCI: {source: '9dd6646ba3985577619e5c2a25894ebf44072410', run: 42001045877},
            exactSourceCI: false, repeatedTestsSkipped: true,
            skipped: ['prompts/types/lint/JS contracts', 'Expo doctor', 'Swift contracts', 'app UI', 'keyboard UI', 'installed keyboard', 'live providers', 'unsigned simulator build'],
            priorBuild61Failure: 'Installed keyboard test failed before signing/upload. This build uses the user-authorized no-test path.',
            completeAppAcceptance: false, automaticReturnAccepted: false,
            physicalAppleModelQualityAccepted: false, appStoreAcceptance: false,
            knownLimitations: ['Direct TextComposer service access, background inference, quality and latency require physical iPhone acceptance', 'Private API public App Store acceptance is unverified', 'Missing installed translation languages fail without UI']
          }, null, 2) + '\n');
          NODE
      - name: Read complete Apple inventory before signing
        env:
          ASC_KEY: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          node scripts/read-apple-inventory.cjs "$RUNNER_TEMP/apple-inventory-signing.json"
          INVENTORY_PATH="$RUNNER_TEMP/apple-inventory-signing.json" node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.env.INVENTORY_PATH));
          assert.equal(report.complete, true);
          assert.deepEqual(report.errors, []);
          for (const collection of Object.values(report.collections)) assert.equal(collection.complete, true);
          for (const build of report.collections.builds.data) assert.ok(Number(build.attributes.version) < 84, 'Build number is already used or superseded');
          for (const upload of report.collections.uploads.data) assert.ok(Number(upload.attributes.cfBundleVersion) < 84, 'Build number already has an upload or is superseded');
          const selected = require(process.cwd() + '/app.json').expo.version.split('.').map(Number);
          const approved = new Set(['READY_FOR_SALE', 'READY_FOR_DISTRIBUTION', 'PENDING_DEVELOPER_RELEASE', 'PENDING_APPLE_RELEASE']);
          for (const item of report.collections.appStoreVersions.data) {
            const a = item.attributes;
            if (!approved.has(a.appStoreState) && !approved.has(a.appVersionState)) continue;
            assert.match(a.versionString, /^\d+\.\d+\.\d+$/);
            const previous = a.versionString.split('.').map(Number);
            const difference = selected.map((value, index) => value - previous[index]).find(value => value !== 0) ?? 0;
            assert.ok(difference > 0, 'Marketing version must exceed every approved App Store version');
          }
          assert.ok(Date.now() - Date.parse(report.finished_at) < 60000, 'Apple inventory is stale');
          NODE
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci
      - name: Generate native project
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Verify patched native source targets
        run: node scripts/verify-react-native-source.cjs
      - name: Install existing Apple signing credentials
        env:
          CLARIFY_IOS_CERTIFICATE_BASE64: ${{ secrets.CLARIFY_IOS_CERTIFICATE_BASE64 }}
          CLARIFY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CLARIFY_IOS_CERTIFICATE_PASSWORD }}
          CLARIFY_IOS_PROFILES_GZIP_BASE64: ${{ secrets.CLARIFY_IOS_PROFILES_GZIP_BASE64 }}
        run: python3 scripts/ios-signing.py install
      - name: Apply signing to generated app and extension targets
        run: ruby scripts/ios-signing.rb
      - name: Archive and export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Clarify.xcworkspace -scheme Clarify \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Clarify.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ClarifyDerivedData" archive 2>&1 | tee "$RUNNER_TEMP/clarify-archive.log" | xcbeautify
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Clarify.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/clarify-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/clarify-export" 2>&1 | tee "$RUNNER_TEMP/clarify-export.log" | xcbeautify
      - name: Verify signed app and both extensions
        run: python3 scripts/verify-ios-ipa.py "$RUNNER_TEMP/clarify-export/Clarify.ipa"
      - name: Read complete Apple inventory before upload
        env:
          ASC_KEY: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          node scripts/read-apple-inventory.cjs "$RUNNER_TEMP/apple-inventory-upload.json"
          INVENTORY_PATH="$RUNNER_TEMP/apple-inventory-upload.json" node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.env.INVENTORY_PATH));
          assert.equal(report.complete, true);
          assert.deepEqual(report.errors, []);
          for (const collection of Object.values(report.collections)) assert.equal(collection.complete, true);
          for (const build of report.collections.builds.data) assert.ok(Number(build.attributes.version) < 84, 'Build number is already used or superseded');
          for (const upload of report.collections.uploads.data) assert.ok(Number(upload.attributes.cfBundleVersion) < 84, 'Build number already has an upload or is superseded');
          const selected = require(process.cwd() + '/app.json').expo.version.split('.').map(Number);
          const approved = new Set(['READY_FOR_SALE', 'READY_FOR_DISTRIBUTION', 'PENDING_DEVELOPER_RELEASE', 'PENDING_APPLE_RELEASE']);
          for (const item of report.collections.appStoreVersions.data) {
            const a = item.attributes;
            if (!approved.has(a.appStoreState) && !approved.has(a.appVersionState)) continue;
            assert.match(a.versionString, /^\d+\.\d+\.\d+$/);
            const previous = a.versionString.split('.').map(Number);
            const difference = selected.map((value, index) => value - previous[index]).find(value => value !== 0) ?? 0;
            assert.ok(difference > 0, 'Marketing version must exceed every approved App Store version');
          }
          assert.ok(Date.now() - Date.parse(report.finished_at) < 60000, 'Apple inventory is stale');
          NODE
      - name: Upload directly to App Store Connect
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/clarify-upload/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$RUNNER_TEMP/clarify-upload" "$key_dir"
          printf '%s' "$CLARIFY_ASC_KEY_P8" > "$key_dir/AuthKey_${CLARIFY_ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${CLARIFY_ASC_KEY_ID}.p8"
          trap 'rm -rf "$key_dir"' EXIT
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timezone
          output = Path(os.environ['RUNNER_TEMP']) / 'clarify-export'
          verification = json.loads((output / 'verification.json').read_text())
          assert hashlib.sha256((output / 'Clarify.ipa').read_bytes()).hexdigest() == verification['sha256'], 'Verified IPA changed before upload'
          receipt = {'state': 'started', 'source': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ipa_sha256': verification['sha256'], 'started_utc': datetime.now(timezone.utc).isoformat()}
          with (output / 'upload-receipt.json').open('x') as stream:
              json.dump(receipt, stream)
          PY
          set +e
          API_PRIVATE_KEYS_DIR="$key_dir" xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/clarify-export/Clarify.ipa" \
            --apiKey "$CLARIFY_ASC_KEY_ID" --apiIssuer "$CLARIFY_ASC_ISSUER_ID"
          upload_exit=$?
          set -e
          UPLOAD_EXIT="$upload_exit" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path(os.environ['RUNNER_TEMP']) / 'clarify-export/upload-receipt.json'
          receipt = json.loads(path.read_text())
          receipt.update(state='confirmed' if os.environ['UPLOAD_EXIT'] == '0' else 'uncertain', upload_exit=int(os.environ['UPLOAD_EXIT']), finished_utc=datetime.now(timezone.utc).isoformat())
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          exit "$upload_exit"
      - name: Preserve verified IPA and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clarify-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/clarify-export/Clarify.ipa
            ${{ runner.temp }}/clarify-export/Clarify.ipa.sha256
            ${{ runner.temp }}/clarify-export/verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify processing and publish to the existing internal group
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: node scripts/publish-testflight.cjs
      - name: Seal TestFlight candidate evidence
        working-directory: .
        run: |
          cp mobile/test-results/testflight-availability.json "$RUNNER_TEMP/clarify-export/testflight-availability.json"
          python3 scripts/app_store_handoff.py seal-evidence \
            --source-sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-directory "$RUNNER_TEMP/clarify-export" --output "$RUNNER_TEMP/testflight-candidate"
      - name: Preserve TestFlight candidate evidence
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clarify-testflight-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-candidate/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Record the production-identity candidate selector
        env:
          CANDIDATE_ARTIFACT: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: echo "TestFlight candidate run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT, artifact $CANDIDATE_ARTIFACT, digest sha256:${CANDIDATE_DIGEST#sha256:}. App Store submission remains manual." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve signing and upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clarify-ios-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            mobile/test-results/testflight-testing-scope.json
            mobile/test-results/testflight-availability.json
            ${{ runner.temp }}/apple-inventory-*.json
            ${{ runner.temp }}/clarify-archive.log
            ${{ runner.temp }}/clarify-export.log
            ${{ runner.temp }}/clarify-export/verification.json
            ${{ runner.temp }}/clarify-export/upload-receipt.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove temporary signing credentials
        if: always()
        run: python3 scripts/ios-signing.py clean
