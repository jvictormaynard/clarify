name: iOS TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'jvictormaynard/clarify' && github.ref == 'refs/heads/codex/apple-client-contract-inspection'
    runs-on: ${{ vars.CLARIFY_IOS_RUNNER == 'bitrise' && 'bitrise-runner-clarify-ios-validation' || 'macos-26' }}
    timeout-minutes: 10
    steps:
      - name: Inspect native client method contracts without invoking a model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/client-contract"
          xcodebuild -version > "$RUNNER_TEMP/client-contract/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/client-contract/toolchain.txt"
          uname -m >> "$RUNNER_TEMP/client-contract/toolchain.txt"
          cat > "$RUNNER_TEMP/client-contract/probe.m" <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>
          #import <stdio.h>
          __attribute__((noinline)) void probe_ready(void) { puts("inspection_ready"); }
          static void describe(const char *name) {
            Class cls = objc_getClass(name);
            printf("CLASS %s loaded=%d\n",name,cls!=Nil);
            if(!cls)return;
            for(int isClass=0;isClass<2;isClass++) {
              unsigned count=0;
              Method *methods=class_copyMethodList(isClass?object_getClass(cls):cls,&count);
              for(unsigned i=0;i<count;i++) {
                const char *selector=sel_getName(method_getName(methods[i]));
                if(strcasestr(selector,"rewrit")||strcasestr(selector,"shared")||strcasestr(selector,"cancel")||strcmp(selector,"init")==0)
                  printf("METHOD %s %c%s encoding=%s address=%p\n",name,isClass?'+':'-',selector,method_getTypeEncoding(methods[i]),method_getImplementation(methods[i]));
              }
              free(methods);
            }
          }
          int main(void) { @autoreleasepool {
            void *image=dlopen("/System/Library/PrivateFrameworks/TextComposer.framework/TextComposer",RTLD_NOW|RTLD_LOCAL);
            printf("TextComposer_loaded=%d\n",image!=NULL);
            describe("TCGenerativeExperiencesRunner");
            describe("TCTextCompositionAssistant");
            describe("_TtC12TextComposer26TCTextCompositionXPCClient");
            probe_ready();
          } return 0; }
          OBJC
          clang -fobjc-arc -g -O0 -framework Foundation "$RUNNER_TEMP/client-contract/probe.m" -o "$RUNNER_TEMP/client-contract/probe"
          "$RUNNER_TEMP/client-contract/probe" > "$RUNNER_TEMP/client-contract/runtime-metadata.txt"
          cat > "$RUNNER_TEMP/client-contract/commands.lldb" <<'LLDB'
          settings set target.disable-aslr false
          breakpoint set --name probe_ready
          run
          image lookup -r -n 'TCGenerativeExperiencesRunner'
          image lookup -r -n 'requestRewritingOfInput'
          disassemble --name '-[TCGenerativeExperiencesRunner requestRewritingOfAttributedString:range:rewritingType:options:completionHandler:]' --count 250
          disassemble --name '-[TCTextCompositionAssistant requestRewritingOfInput:rewritingType:completionHandler:]' --count 300
          disassemble --name '-[TCTextCompositionAssistant requestRewritingOfAttributedString:range:rewritingType:options:completionHandler:]' --count 250
          image dump symtab TextComposer
          quit
          LLDB
          lldb --batch --source "$RUNNER_TEMP/client-contract/commands.lldb" "$RUNNER_TEMP/client-contract/probe" > "$RUNNER_TEMP/client-contract/disassembly.txt" 2>&1 || true
          rm "$RUNNER_TEMP/client-contract/probe"
          echo 'Read-only native metadata/disassembly inspection finished. No model or service-worker initialization was invoked.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: clarify-client-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/client-contract/*
          retention-days: 3
          if-no-files-found: error
