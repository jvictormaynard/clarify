name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Original uploaded build 72 source
        type: string
        required: true
      mode:
        type: choice
        options: [availability]
        default: availability
permissions:
  contents: read
  actions: read
concurrency:
  group: clarify-ios-availability-build72
  queue: max
  cancel-in-progress: false
jobs:
  availability:
    name: Correct release notes and verify existing build 72
    if: github.repository == 'jvictormaynard/clarify' && github.ref == 'refs/heads/codex/apple-build72-notes' && inputs.source_sha == '999af68ddc12a4420ab172ddab52b0615b0ea518' && inputs.mode == 'availability'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ios-testflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Verify the existing confirmed upload before metadata changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42460710243 --repo jvictormaynard/clarify \
            --name clarify-ios-delivery-999af68ddc12a4420ab172ddab52b0615b0ea518-1 \
            --dir "$RUNNER_TEMP/build72-delivery"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'build72-delivery'
          receipts = list(root.rglob('upload-receipt.json'))
          checks = list(root.rglob('verification.json'))
          assert len(receipts) == len(checks) == 1
          receipt = json.loads(receipts[0].read_text())
          check = json.loads(checks[0].read_text())
          assert receipt['state'] == 'confirmed'
          assert receipt['source'] == '999af68ddc12a4420ab172ddab52b0615b0ea518'
          assert str(receipt['run_id']) == '42460710243' and str(receipt['attempt']) == '1'
          assert receipt['ipa_sha256'] == check['sha256'] == '81230a0031805a2a4fc1bbf910e991c2146e2ece792f41ba4a502323c07aab9d'
          config = json.loads(Path('mobile/app.json').read_text())['expo']
          assert (config['version'], config['ios']['buildNumber']) == ('0.14.1', '72')
          print('Confirmed original signed upload; metadata-only operation.')
          PY
      - name: Correct notes and verify actual tester availability
        working-directory: mobile
        env:
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: node scripts/publish-testflight.cjs
      - name: Preserve follow-up availability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: clarify-build72-availability-${{ github.run_id }}
          path: mobile/test-results/testflight-availability.json
          if-no-files-found: ignore
          retention-days: 90
