name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
jobs:
  plan:
    name: Select validation tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      static: ${{ steps.plan.outputs.static }}
      python: ${{ steps.plan.outputs.python }}
      qt: ${{ steps.plan.outputs.qt }}
      settings_unit: ${{ steps.plan.outputs.settings_unit }}
      settings_browser: ${{ steps.plan.outputs.settings_browser }}
      package: ${{ steps.plan.outputs.package }}
      installer: ${{ steps.plan.outputs.installer }}
      server: ${{ steps.plan.outputs.server }}
      mobile: ${{ steps.plan.outputs.mobile }}
      ios: ${{ steps.plan.outputs.ios }}
      audit: ${{ steps.plan.outputs.audit }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - id: plan
        env:
          CI_RUNNER_PROVIDER: ${{ vars.CI_RUNNER_PROVIDER || 'github' }}
        run: python scripts/ci.py --github-plan
  policy:
    name: Repository and delivery policy
    needs: plan
    runs-on: ${{ needs.plan.outputs.linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
        with:
          platform: linux
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
        working-directory: ci
      - run: python scripts/ci.py --task policy
  static:
    name: Python lint, format and types
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ${{ needs.plan.outputs.linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
        with:
          platform: linux
      - run: python scripts/ci.py --task static
  python:
    name: python (${{ matrix.platform }} ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ${{ matrix.platform == 'windows' && needs.plan.outputs.windows || needs.plan.outputs.linux }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        shard: [1/2, 2/2]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      PYTHONFAULTHANDLER: "1"
      CLARIFY_TEST_DURATIONS_UNIT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
        with:
          platform: ${{ matrix.platform }}
      - run: python scripts/ci.py --task python --shard ${{ matrix.shard }}
      - name: Retain test durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-durations-${{ matrix.platform }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/durations/*.json
          if-no-files-found: error
          retention-days: 14
  qt:
    name: qt (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.qt == 'true'
    runs-on: ${{ matrix.platform == 'windows' && needs.plan.outputs.windows || needs.plan.outputs.linux }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      PYTHONFAULTHANDLER: "1"
      CLARIFY_TEST_DURATIONS_UNIT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
        with:
          platform: ${{ matrix.platform }}
          qt: "true"
      - name: Check dependency locks
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-${{ matrix.platform }}.txt --allow-unsafe
      - name: Check Windows runtime pins
        if: matrix.platform == 'windows'
        run: |
          python scripts/check_dependency_lock.py --lock-file requirements-lock-runtime-windows.txt --requirements-file requirements.txt
          python scripts/check_runtime_lock.py
      - run: python scripts/ci.py --task qt
      - name: Retain test durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qt-durations-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/durations/*.json
            ${{ runner.temp }}/qt-artifacts/
          if-no-files-found: error
          retention-days: 14
  settings_unit:
    name: Settings unit tests
    needs: plan
    if: needs.plan.outputs.settings_unit == 'true'
    runs-on: ${{ needs.plan.outputs.linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-fund
        working-directory: desktop
      - run: python scripts/ci.py --task settings_unit
  settings_browser:
    name: Settings browser, bridge and production boot
    needs: plan
    if: needs.plan.outputs.settings_browser == 'true'
    runs-on: ${{ needs.plan.outputs.linux }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
        with:
          platform: linux
          qt: "true"
      - uses: ./.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/bin/python
          native: "false"
  server:
    name: server validation
    needs: plan
    if: needs.plan.outputs.server == 'true'
    uses: ./.github/workflows/server-validation.yml
    with:
      linux-runner: ${{ needs.plan.outputs.linux }}
  ios:
    name: ios validation
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/ios-validation.yml
  audit:
    name: audit validation
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    uses: ./.github/workflows/dependency-audit.yml
    with:
      linux-runner: ${{ needs.plan.outputs.linux }}
  mobile:
    name: Mobile checks
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ${{ needs.plan.outputs.linux }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-fund
      - run: python ../scripts/ci.py --task mobile
  package:
    name: Package Windows executable
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-windows.txt
      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-windows.txt
      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-windows.txt
      - name: Validate and build Settings
        uses: ./.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/python.exe
          test: "false"
      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build.ps1 -SettingsExecutable dist\clarify-settings.exe
      - name: Build installer baseline only when required
        if: ${{ (needs.plan.outputs.installer == 'true') }}
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -SettingsExecutable dist\clarify-settings.exe `
            -OutputDirectory dist\baseline `
            -PayloadIdentity baseline-msi-0.1.1
          $baselineHash = (Get-FileHash dist\baseline\Clarify.exe -Algorithm SHA256).Hash
          $currentHash = (Get-FileHash dist\Clarify.exe -Algorithm SHA256).Hash
          if ($baselineHash -eq $currentHash) {
            throw 'Baseline and current executable payloads must be byte-distinct.'
          }
      - name: Verify frozen portable replacement and recovery
        run: python scripts/test_portable_update.py
      - name: Smoke-test packaged QML entrypoint
        shell: pwsh
        run: |
          $executable = (Resolve-Path .\dist\Clarify.exe).Path
          $smokeDataDirectory = Join-Path $env:RUNNER_TEMP "clarify-packaged-smoke"
          New-Item -Path $smokeDataDirectory -ItemType Directory -Force | Out-Null
          $previousDataDirectory = $env:CLARIFY_DATA_DIR
          $env:CLARIFY_DATA_DIR = $smokeDataDirectory
          try {
            $process = Start-Process -FilePath $executable `
              -ArgumentList @('--hidden') -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                throw "Packaged QML entrypoint exited during hidden launch (exit code $($process.ExitCode))."
              }
            } finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          } finally {
            if ($null -eq $previousDataDirectory) {
              Remove-Item Env:CLARIFY_DATA_DIR -ErrorAction SilentlyContinue
            } else {
              $env:CLARIFY_DATA_DIR = $previousDataDirectory
            }
          }
      - name: Validate secret-store contract
        run: python -c "import sys; sys.argv = ['app.py', 'secret-store-self-test']; import app; raise SystemExit(app._run_cli(['secret-store-self-test']))"
      - name: Upload smoke-test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Clarify-windows-${{ github.sha }}
          path: |
            dist/Clarify.exe
            dist/baseline/Clarify.exe
            dist/Clarify-qt-sources.zip
            dist/Clarify-qt-NOTICES.txt
          if-no-files-found: error
          retention-days: 7
  installer:
    name: Windows installer lifecycle
    needs:
      - plan
      - package
    if: needs.plan.outputs.installer == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked manifest dependencies
        run: python -m pip install --disable-pip-version-check requests -c requirements-lock-windows.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Clarify-windows-${{ github.sha }}
          path: dist
      - name: Build baseline and current installers
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -Version 0.1.1 `
            -SourceExe dist\baseline\Clarify.exe `
            -OutputPath dist\Clarify-windows-x64-baseline.msi
          .\scripts\build-installer.ps1 `
            -SourceExe dist\Clarify.exe `
            -OutputPath dist\Clarify-windows-x64.msi
      - name: Test install, upgrade, repair, rollback, and uninstall
        shell: pwsh
        run: |
          .\scripts\test-installer.ps1 `
            -BaselineInstaller dist\Clarify-windows-x64-baseline.msi `
            -CurrentInstaller dist\Clarify-windows-x64.msi `
            -BaselinePayloadSha256 $((Get-FileHash dist\baseline\Clarify.exe -Algorithm SHA256).Hash) `
            -CurrentPayloadSha256 $((Get-FileHash dist\Clarify.exe -Algorithm SHA256).Hash)
      - name: Validate release manifest contract
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          python .\scripts\create_release_manifest.py `
            --version $version `
            --installer dist\Clarify-windows-x64.msi `
            --output dist\release-manifest.json
          .\scripts\build-manifest-container.ps1 `
            -Manifest dist\release-manifest.json `
            -OutputPath dist\Clarify-release-manifest.cab
  required:
    name: CI required
    if: always()
    needs: [plan, policy, static, python, qt, settings_unit, settings_browser, package, installer, server, mobile, ios, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require every selected job and matrix to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci.py --check-results
