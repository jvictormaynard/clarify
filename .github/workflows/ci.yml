  package:
    name: Package Windows executable
    needs: components
    if: needs.components.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted MAIN controls
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate source
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QA controller Python
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up pinned QA Node
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Authenticate trusted controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py authenticate
      - name: Verify source checkout
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py prepare
        id: qa_source
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: ${{ !inputs.trusted_qa }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-windows.txt
        if: ${{ !inputs.trusted_qa }}
      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-windows.txt
        if: ${{ !inputs.trusted_qa }}
      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-windows.txt
        if: ${{ !inputs.trusted_qa }}
      - name: Validate and build Settings
        uses: ./.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/python.exe
          test: "false"
        if: ${{ !inputs.trusted_qa }}
      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build.ps1 -SettingsExecutable dist\clarify-settings.exe
        if: ${{ !inputs.trusted_qa }}
      - name: Build installer baseline only when required
        if: ${{ !inputs.trusted_qa && (needs.components.outputs.installer == 'true') }}
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -SettingsExecutable dist\clarify-settings.exe `
            -OutputDirectory dist\baseline `
            -PayloadIdentity baseline-msi-0.1.1
          $baselineHash = (Get-FileHash dist\baseline\Clarify.exe -Algorithm SHA256).Hash
          $currentHash = (Get-FileHash dist\Clarify.exe -Algorithm SHA256).Hash
          if ($baselineHash -eq $currentHash) {
            throw 'Baseline and current executable payloads must be byte-distinct.'
          }
      - name: Verify frozen portable replacement and recovery
        run: python scripts/test_portable_update.py
        if: ${{ !inputs.trusted_qa }}
      - name: Smoke-test packaged QML entrypoint
        shell: pwsh
        run: |
          $executable = (Resolve-Path .\dist\Clarify.exe).Path
          $smokeDataDirectory = Join-Path $env:RUNNER_TEMP "clarify-packaged-smoke"
          New-Item -Path $smokeDataDirectory -ItemType Directory -Force | Out-Null
          $previousDataDirectory = $env:CLARIFY_DATA_DIR
          $env:CLARIFY_DATA_DIR = $smokeDataDirectory
          try {
            $process = Start-Process -FilePath $executable `
              -ArgumentList @('--hidden') -WindowStyle Hidden -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                throw "Packaged QML entrypoint exited during hidden launch (exit code $($process.ExitCode))."
              }
            } finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          } finally {
            if ($null -eq $previousDataDirectory) {
              Remove-Item Env:CLARIFY_DATA_DIR -ErrorAction SilentlyContinue
            } else {
              $env:CLARIFY_DATA_DIR = $previousDataDirectory
            }
          }
        if: ${{ !inputs.trusted_qa }}
      - name: Validate secret-store contract
        run: python -c "import sys; sys.argv = ['app.py', 'secret-store-self-test']; import app; raise SystemExit(app._run_cli(['secret-store-self-test']))"
        if: ${{ !inputs.trusted_qa }}
      - name: Upload smoke-test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Clarify-windows-${{ github.sha }}
          path: |
            dist/Clarify.exe
            dist/baseline/Clarify.exe
            dist/Clarify-qt-sources.zip
            dist/Clarify-qt-NOTICES.txt
          if-no-files-found: error
          retention-days: 7
        if: ${{ !inputs.trusted_qa }}
      - name: Build candidate package with trusted controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py run --recipe package
      - name: Retain QA Windows package
        if: ${{ inputs.trusted_qa }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Clarify-qa-windows-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: execution/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Verify source checkout after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-source
      - name: Verify trusted controls after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-controls
      - name: Retain QA observations and inert diagnostic logs
        if: ${{ always() && inputs.trusted_qa }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-ci-observations-${{ env.QA_COMPONENT_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/clarify-trusted-ci/
            execution/mobile/test-results/
            execution/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_BASE_SHA: ${{ inputs.base_sha }}
      QA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_COMPONENT_KEY: package_windows
      QA_TRUSTED_MODE: ${{ inputs.trusted_qa }}
