name: CI
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch: null
  workflow_call:
    inputs:
      trusted_qa:
        type: boolean
        default: false
      source_sha:
        type: string
        default: ""
      base_sha:
        type: string
        default: ""
      trusted_sha:
        type: string
        default: ""
    outputs:
      selected_keys:
        value: ${{ jobs.components.outputs.selected_keys }}
      source_tree:
        value: ${{ jobs.components.outputs.source_tree }}
      base_tree:
        value: ${{ jobs.components.outputs.base_tree }}
      plan_digest:
        value: ${{ jobs.components.outputs.plan_digest }}
      controls_digest:
        value: ${{ jobs.components.outputs.controls_digest }}
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.trusted_qa && format('qa-{0}-{1}', inputs.source_sha, github.run_id) || github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
jobs:
  components:
    name: Select component validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ inputs.trusted_qa && steps.qa_select.outputs.desktop || steps.components.outputs.desktop }}
      settings: ${{ inputs.trusted_qa && steps.qa_select.outputs.settings || steps.components.outputs.settings }}
      package: ${{ inputs.trusted_qa && steps.qa_select.outputs.package || steps.components.outputs.package }}
      installer: ${{ inputs.trusted_qa && steps.qa_select.outputs.installer || steps.components.outputs.installer }}
      server: ${{ inputs.trusted_qa && steps.qa_select.outputs.server || steps.components.outputs.server }}
      mobile: ${{ inputs.trusted_qa && steps.qa_select.outputs.mobile || steps.components.outputs.mobile }}
      ios: ${{ inputs.trusted_qa && steps.qa_select.outputs.ios || steps.components.outputs.ios }}
      audit: ${{ inputs.trusted_qa && steps.qa_select.outputs.audit || steps.components.outputs.audit }}
      qa_policy: ${{ inputs.trusted_qa && steps.qa_select.outputs.qa_policy || steps.components.outputs.qa_policy }}
      selected_keys: ${{ steps.qa_select.outputs.selected_keys }}
      source_tree: ${{ steps.qa_select.outputs.source_tree }}
      base_tree: ${{ steps.qa_select.outputs.base_tree }}
      plan_digest: ${{ steps.qa_select.outputs.plan_digest }}
      controls_digest: ${{ steps.qa_select.outputs.controls_digest }}
    steps:
      - name: Check out trusted MAIN controls
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate source
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QA controller Python
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Authenticate trusted workflow and controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py authenticate
      - name: Resolve source and base Git objects
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
        if: ${{ !inputs.trusted_qa }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
        if: ${{ !inputs.trusted_qa }}
      - id: components
        run: python scripts/delivery_policy.py
        if: ${{ !inputs.trusted_qa }}
      - name: Select trusted validation plan
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py select
        id: qa_select
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_BASE_SHA: ${{ inputs.base_sha }}
      QA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_COMPONENT_KEY: selection
      QA_TRUSTED_MODE: ${{ inputs.trusted_qa }}
  repository:
    name: Repository checks
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted MAIN controls
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate source
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QA controller Python
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up pinned QA Node
        if: ${{ inputs.trusted_qa && needs.components.outputs.qa_policy != 'false' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Authenticate trusted controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py authenticate
      - name: Verify source checkout
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py prepare
        id: qa_source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: ${{ !inputs.trusted_qa }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
        if: ${{ !inputs.trusted_qa }}
      - name: Check project agent skills
        run: python scripts/check_agent_skills.py
        if: ${{ !inputs.trusted_qa }}
      - name: Set up policy test Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: desktop/package-lock.json
        if: ${{ !inputs.trusted_qa && needs.components.outputs.qa_policy != 'false' }}
      - name: Install locked policy test dependencies
        run: npm ci --prefix desktop --ignore-scripts --no-fund
        if: ${{ !inputs.trusted_qa && needs.components.outputs.qa_policy != 'false' }}
      - name: Test validation and release policies
        run: |
          python -m unittest discover -s tests -p test_delivery_policy.py -v
          python -m unittest discover -s tests -p test_release_delivery.py -v
          python -m unittest discover -s tests -p test_testflight_candidate.py -v
        if: ${{ !inputs.trusted_qa }}
      - name: Test QA and archive policies
        run: |
          python -m unittest discover -s tests -p test_trusted_ci.py -v
          python -m unittest discover -s tests -p test_testflight_qa.py -v
          python -m unittest discover -s tests -p test_qa_device_archive.py -v
        if: ${{ !inputs.trusted_qa && needs.components.outputs.qa_policy != 'false' }}
      - name: Run trusted repository checks
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py run --recipe repository
      - name: Verify source checkout after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-source
      - name: Verify trusted controls after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-controls
      - name: Retain QA observations and inert diagnostic logs
        if: ${{ always() && inputs.trusted_qa }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-ci-observations-${{ env.QA_COMPONENT_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/clarify-trusted-ci/
            execution/mobile/test-results/
            execution/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_BASE_SHA: ${{ inputs.base_sha }}
      QA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_COMPONENT_KEY: repository
      QA_TRUSTED_MODE: ${{ inputs.trusted_qa }}
  server:
    name: Server validation
    needs: components
    if: needs.components.outputs.server == 'true'
    uses: ./.github/workflows/server-validation.yml
    with:
      trusted_qa: ${{ inputs.trusted_qa || false }}
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      trusted_sha: ${{ inputs.trusted_sha }}
  ios:
    name: iOS validation
    needs: components
    if: needs.components.outputs.ios == 'true'
    uses: ./.github/workflows/ios-validation.yml
    with:
      trusted_qa: ${{ inputs.trusted_qa || false }}
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      trusted_sha: ${{ inputs.trusted_sha }}
  audit:
    name: Dependency audits
    needs: components
    if: needs.components.outputs.audit == 'true'
    uses: ./.github/workflows/dependency-audit.yml
    with:
      trusted_qa: ${{ inputs.trusted_qa || false }}
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      trusted_sha: ${{ inputs.trusted_sha }}
  mobile:
    name: Mobile checks
    needs: components
    if: needs.components.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_BASE_SHA: ${{ inputs.base_sha }}
      QA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_COMPONENT_KEY: mobile
      QA_TRUSTED_MODE: ${{ inputs.trusted_qa }}
    steps:
      - name: Check out trusted MAIN controls
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate source
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QA controller Python
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up pinned QA Node
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Authenticate trusted controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py authenticate
      - name: Verify source checkout
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py prepare
        id: qa_source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: ${{ !inputs.trusted_qa }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
        if: ${{ !inputs.trusted_qa }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
        if: ${{ !inputs.trusted_qa }}
      - run: npm ci --no-fund
        if: ${{ !inputs.trusted_qa }}
      - run: npm run check
        if: ${{ !inputs.trusted_qa }}
      - name: Build the iOS JavaScript bundle
        run: npx --no-install expo export --platform ios --max-workers 2 --output-dir "$RUNNER_TEMP/clarify-mobile-export"
        if: ${{ !inputs.trusted_qa }}
      - name: Run trusted mobile checks
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py run --recipe mobile
      - name: Verify source checkout after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-source
      - name: Verify trusted controls after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-controls
      - name: Retain QA observations and inert diagnostic logs
        if: ${{ always() && inputs.trusted_qa }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-ci-observations-${{ env.QA_COMPONENT_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/clarify-trusted-ci/
            execution/mobile/test-results/
            execution/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false
  settings:
    name: Settings web and bridge
    needs: components
    if: needs.components.outputs.settings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_BASE_SHA: ${{ inputs.base_sha }}
      QA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_COMPONENT_KEY: settings
      QA_TRUSTED_MODE: ${{ inputs.trusted_qa }}
    steps:
      - name: Check out trusted MAIN controls
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate source
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QA controller Python
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up pinned QA Node
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Authenticate trusted controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py authenticate
      - name: Verify source checkout
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py prepare
        id: qa_source
      - name: Install QA runner libraries
        if: ${{ inputs.trusted_qa && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core libportaudio2
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: ${{ !inputs.trusted_qa }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core libportaudio2
        if: ${{ !inputs.trusted_qa }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock-linux.txt
        if: ${{ !inputs.trusted_qa }}
      - run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-linux.txt
        if: ${{ !inputs.trusted_qa }}
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-linux.txt
        if: ${{ !inputs.trusted_qa }}
      - uses: ./.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/bin/python
          native: "false"
        if: ${{ !inputs.trusted_qa }}
      - name: Run trusted Settings validation
        if: ${{ inputs.trusted_qa }}
        uses: ./trusted/.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/bin/python
          native: "false"
          trusted-qa: "true"
          source-root: execution
          trusted-root: trusted
      - name: Verify source checkout after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-source
      - name: Verify trusted controls after execution
        if: ${{ always() && inputs.trusted_qa && steps.qa_source.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py verify-controls
      - name: Retain QA observations and inert diagnostic logs
        if: ${{ always() && inputs.trusted_qa }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-ci-observations-${{ env.QA_COMPONENT_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/clarify-trusted-ci/
            execution/mobile/test-results/
            execution/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false
  test:
    name: Tests (${{ matrix.os }})
    needs: components
    if: needs.components.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock_file: requirements-lock-linux.txt
          - os: windows-latest
            lock_file: requirements-lock-windows.txt
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      PYTHONFAULTHANDLER: "1"
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_BASE_SHA: ${{ inputs.base_sha }}
      QA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_COMPONENT_KEY: ${{ matrix.os == 'windows-latest' && 'python_windows' || 'python_linux' }}
      QA_TRUSTED_MODE: ${{ inputs.trusted_qa }}
    steps:
      - name: Check out trusted MAIN controls
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate source
        if: ${{ inputs.trusted_qa }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QA controller Python
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up pinned QA Node
        if: ${{ inputs.trusted_qa }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Authenticate trusted controls
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py authenticate
      - name: Verify source checkout
        if: ${{ inputs.trusted_qa }}
        working-directory: ${{ github.workspace }}
        run: python trusted/scripts/trusted_ci.py prepare
        id: qa_source
      - name: Install QA runner libraries
        if: ${{ inputs.trusted_qa && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core libportaudio2
        working-directory: ${{ github.workspace }}
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: ${{ !inputs.trusted_qa }}
      - name: Install Linux Qt runtime libraries
        if: ${{ !inputs.trusted_qa && (matrix.os == 'ubuntu-latest') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-linux.txt
            requirements-lock-windows.txt
            requirements-lock-runtime-windows.txt
        if: ${{ !inputs.trusted_qa }}
      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file "${{ matrix.lock_file }}"
        if: ${{ !inputs.trusted_qa }}
      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c "${{ matrix.lock_file }}"
        if: ${{ !inputs.trusted_qa }}
      - name: Check dependency lock
        run: python scripts/check_dependency_lock.py --lock-file "${{ matrix.lock_file }}" --allow-unsafe
        if: ${{ !inputs.trusted_qa }}
      - name: Check runtime dependency lock
        if: ${{ !inputs.trusted_qa && (matrix.os == 'windows-latest') }}
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-runtime-windows.txt --requirements-file requirements.txt
      - name: Check runtime pins match build lock
        if: ${{ !inputs.trusted_qa && (matrix.os == 'windows-latest') }}
        run: python scripts/check_runtime_lock.py
      - name: Run Ruff lint
        if: ${{ !inputs.trusted_qa && (matrix.os == 'ubuntu-latest') }}
        run: >-
          ruff check desktop_state.py windows_hotkeys.py scripts/dependency_audit.py scripts/format_staged.py scripts/run_tests.py tests/test_test_environment.py
          clarify/desktop/qml_app.py clarify/desktop/qml_bridge.py clarify/desktop/qml_runtime.py
          workflow_provider.py tests/test_workflow_provider.py
          computer_host.py computer_processing.py clarify/desktop/qml_computer.py
