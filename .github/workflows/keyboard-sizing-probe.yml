name: Keyboard sizing probe
on:
  push:
    branches: [codex/history-origin-keyboard-presentation]
    paths: [.github/workflows/keyboard-sizing-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: probe (${{ matrix.toolchain }} / ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: native-constrained, toolchain: '26.4.1', runner: macos-26, runtime: iOS-26-4, xcode: /Applications/Xcode_26.4.1.app/Contents/Developer}
          - {variant: no-self-sizing, toolchain: '26.4.1', runner: macos-26, runtime: iOS-26-4, xcode: /Applications/Xcode_26.4.1.app/Contents/Developer}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      CLARIFY_KEYBOARD_VARIANTS: ${{ matrix.variant }}
      CLARIFY_IOS_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Measure controller sizing
        run: node scripts/test-keyboard-extension.cjs --compare
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: keyboard-sizing-probe-${{ matrix.toolchain }}-${{ matrix.variant }}-${{ github.sha }}
          path: mobile/test-results
          retention-days: 7
