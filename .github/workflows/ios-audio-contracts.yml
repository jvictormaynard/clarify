name: iOS audio contracts

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - mobile/modules/clarify-core/ios/AudioClipWriter.swift
      - mobile/modules/clarify-core/tests/AudioClipTests.swift
      - .github/workflows/ios-audio-contracts.yml

permissions:
  contents: read

jobs:
  audio:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test real audio encoding with synthetic buffers
        run: swift test --package-path mobile/modules/clarify-core --filter AudioClipTests
