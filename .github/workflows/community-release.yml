name: Community Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact green source SHA of the reviewed release tag
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
  pull-requests: read

concurrency:
  group: community-release
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'jvictormaynard/clarify' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify reviewed source, immutable tag and existing publication
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_delivery.py verify --component desktop --source-sha "$RELEASE_SOURCE" --tag "$RELEASE_TAG"

  release:
    needs: gate
    if: needs.gate.outputs.result == 'publish'
    name: Build unsigned portable release
    runs-on: windows-latest
    environment: portable-updates
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag on canonical main
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify main." }
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          if ($LASTEXITCODE -ne 0) { throw "The release commit must belong to main." }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-windows.txt
            requirements-lock-runtime-windows.txt

      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-windows.txt

      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-windows.txt

      - name: Check development dependency lock
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-windows.txt --allow-unsafe

      - name: Check runtime dependency lock
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-runtime-windows.txt --requirements-file requirements.txt

      - name: Check runtime pins match build lock
        run: python scripts/check_runtime_lock.py

      # The gate verifies exact main CI, including desktop tests and packaging.
      # Keep format and compile coverage that main CI does not provide.
      - name: Check dependency lock test format
        run: ruff format --check tests/test_dependency_lock.py

      - name: Audit dependencies
        run: python scripts/dependency_audit.py

      - name: Compile release scripts
        run: python -m compileall -q scripts

      - name: Validate and build Settings
        uses: ./.github/actions/settings-build
        with:
          python: ${{ env.pythonLocation }}/python.exe
          audit: 'true'

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build.ps1 -SettingsExecutable dist\clarify-settings.exe

      - name: Generate runtime SBOM
        run: cyclonedx-py requirements requirements-lock-runtime-windows.txt --of JSON -o dist\Clarify.sbom.json

      - name: Include portable crypto attribution and OpenSSL in SBOM
        run: python scripts/portable_crypto_inventory.py --output-dir dist --bom dist/Clarify.sbom.json

      - name: Verify frozen portable replacement and recovery
        run: python scripts/test_portable_update.py

      - name: Add bundled SoX to SBOM
        run: python scripts/add_sbom_component.py --bom-file dist\Clarify.sbom.json --runtime-root extra\sox-14.4.2 --manifest scripts\sox-runtime-manifest.json

      - name: Include Settings in the release SBOM
        run: python scripts/settings_inventory.py --merge-bom dist/Clarify.sbom.json --settings-bom dist/Clarify-settings.sbom.json

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match packaged version v$version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create unsigned community assets
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Clarify.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clarify.exe" | Set-Content -Encoding ascii dist\Clarify.exe.sha256
          $soxSource = "dist\sox-14.4.2-source.tar.gz"
          & curl.exe `
            --fail `
            --location `
            --retry 3 `
            --output $soxSource `
            "https://downloads.sourceforge.net/project/sox/sox/14.4.2/sox-14.4.2.tar.gz"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download the corresponding SoX source archive."
          }
          $soxHash = (Get-FileHash $soxSource -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($soxHash -ne "b45f598643ffbd8e363ff24d61166ccec4836fea6d3888881b8df53e3bb55f6c") {
            throw "The downloaded SoX source archive did not match the expected SHA-256."
          }
          Compress-Archive `
            -Path dist\Clarify.exe, dist\Clarify.exe.sha256, dist\Clarify.sbom.json, LICENSE, THIRD_PARTY_NOTICES.md, dist\Clarify-settings-NOTICES.txt, dist\Clarify-qt-NOTICES.txt, dist\Clarify-crypto-NOTICES.txt `
            -DestinationPath dist\Clarify-windows-x64.zip `
            -Force

      - name: Recheck immutable release source before signing
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_delivery.py verify --component desktop --source-sha "$env:RELEASE_SOURCE" --tag "$env:RELEASE_TAG"

      - name: Sign portable update metadata
        if: steps.resume.outputs.result == 'publish'
        env:
          CLARIFY_UPDATE_SIGNING_KEY: ${{ secrets.CLARIFY_UPDATE_SIGNING_KEY }}
        run: python scripts/create_portable_update_manifest.py --source-sha ${{ github.sha }}

      - name: Upload workflow artifact
        if: steps.resume.outputs.result == 'publish'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Clarify-community-${{ github.ref_name }}
          path: |
            dist/Clarify-portable-update.json
            dist/Clarify-portable-update.json.sig
            dist/Clarify.exe
            dist/Clarify.exe.sha256
            dist/Clarify.sbom.json
            dist/Clarify-windows-x64.zip
            dist/sox-14.4.2-source.tar.gz
            dist/Clarify-qt-sources.zip
          if-no-files-found: error

      - name: Attest community release provenance
        if: steps.resume.outputs.result == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Clarify-portable-update.json
            dist/Clarify-portable-update.json.sig
            dist/Clarify.exe
            dist/Clarify.exe.sha256
            dist/Clarify.sbom.json
            dist/Clarify-windows-x64.zip
            dist/sox-14.4.2-source.tar.gz
            dist/Clarify-qt-sources.zip

      - name: Publish unsigned community release
        if: steps.resume.outputs.result == 'publish' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          This is an unsigned community portable release.

          Windows SmartScreen may show a warning because the executable does not have a paid Authenticode publisher signature. Verify Clarify.exe with Clarify.exe.sha256 before launching it.

          This portable release includes Ed25519-authenticated update metadata. Starting with v0.5.0, Clarify checks for newer stable releases and can install them automatically when enabled in Settings. Updates wait until work is complete and Settings are closed, then restart the app. If startup fails, the previous executable is restored.

          The Windows executable is still unsigned. The sponsored Authenticode MSI and its separate signed-CAB update channel remain disabled.
          "@
          gh release create "${{ github.ref_name }}" `
            dist\Clarify-portable-update.json `
            dist\Clarify-portable-update.json.sig `
            dist\Clarify.exe `
            dist\Clarify.exe.sha256 `
            dist\Clarify.sbom.json `
            dist\Clarify-windows-x64.zip `
            dist\sox-14.4.2-source.tar.gz `
            dist\Clarify-qt-sources.zip `
            --verify-tag `
            --notes $notes `
            --title "Clarify ${{ github.ref_name }}"
