name: Community Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build unsigned portable release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock-windows.txt
            requirements-lock-runtime-windows.txt

      - name: Install pinned bootstrap tools
        run: python scripts/install_bootstrap_tools.py --lock-file requirements-lock-windows.txt

      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c requirements-lock-windows.txt

      - name: Check development dependency lock
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-windows.txt --allow-unsafe

      - name: Check runtime dependency lock
        run: python scripts/check_dependency_lock.py --lock-file requirements-lock-runtime-windows.txt --requirements-file requirements.txt

      - name: Check runtime pins match build lock
        run: python scripts/check_runtime_lock.py

      - name: Run Ruff lint
        run: >-
          ruff check desktop_state.py windows_hotkeys.py scripts/dependency_audit.py
          spikes/pyside6/qml_app.py spikes/pyside6/qml_bridge.py spikes/pyside6/qml_runtime.py
          spikes/pyside6/qml_settings.py spikes/pyside6/qml_status.py spikes/pyside6/qml_audio_batch.py
          spikes/pyside6/qml_clipboard.py spikes/pyside6/qml_voice_translation.py
          spikes/pyside6/qt_shell.py tests/test_repository.py tests/test_pyside6_qml.py
          tests/test_pyside6_qml_runtime.py tests/test_pyside6_qml_audio_batch.py
          tests/test_pyside6_qml_clipboard.py tests/test_pyside6_qml_voice_translation.py
          tests/test_pyside6_qt_shell.py

      - name: Run Ruff format check
        run: >-
          ruff format --check scripts/dependency_audit.py tests/test_dependency_lock.py
          tests/test_repository.py spikes/pyside6/qml_app.py spikes/pyside6/qml_bridge.py
          spikes/pyside6/qml_runtime.py spikes/pyside6/qml_settings.py spikes/pyside6/qml_status.py
          spikes/pyside6/qml_audio_batch.py spikes/pyside6/qml_clipboard.py
          spikes/pyside6/qml_voice_translation.py spikes/pyside6/qt_shell.py
          tests/test_pyside6_qml.py tests/test_pyside6_qml_runtime.py
          tests/test_pyside6_qml_audio_batch.py tests/test_pyside6_qml_clipboard.py
          tests/test_pyside6_qml_voice_translation.py tests/test_pyside6_qt_shell.py

      - name: Run targeted type checks
        run: mypy desktop_state.py windows_hotkeys.py

      - name: Audit dependencies
        run: python scripts/dependency_audit.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q spikes/pyside6/qml_app.py spikes/pyside6/qml_bridge.py
          spikes/pyside6/qml_runtime.py spikes/pyside6/qml_settings.py spikes/pyside6/qml_status.py
          spikes/pyside6/qml_audio_batch.py spikes/pyside6/qml_clipboard.py
          spikes/pyside6/qml_voice_translation.py spikes/pyside6/qt_shell.py
          desktop_state.py version.py windows_hotkeys.py audio_file_batch.py
          audio_file_batch_ui.py history_store.py workflow_settings.py tests scripts

      - name: Validate QML assets
        run: >-
          python -c "from pathlib import Path; qml = Path('spikes/pyside6/qml');
          assert qml.is_dir() and (qml / 'Main.qml').is_file() and any(qml.glob('*.qml'))"

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Generate runtime SBOM
        run: cyclonedx-py requirements requirements-lock-runtime-windows.txt --of JSON -o dist\Clarify.sbom.json

      - name: Add bundled SoX to SBOM
        run: python scripts/add_sbom_component.py --bom-file dist\Clarify.sbom.json --runtime-root extra\sox-14.4.2 --manifest scripts\sox-runtime-manifest.json

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match packaged version v$version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create unsigned community assets
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Clarify.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Clarify.exe" | Set-Content -Encoding ascii dist\Clarify.exe.sha256
          $soxSource = "dist\sox-14.4.2-source.tar.gz"
          & curl.exe `
            --fail `
            --location `
            --retry 3 `
            --output $soxSource `
            "https://downloads.sourceforge.net/project/sox/sox/14.4.2/sox-14.4.2.tar.gz"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download the corresponding SoX source archive."
          }
          $soxHash = (Get-FileHash $soxSource -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($soxHash -ne "b45f598643ffbd8e363ff24d61166ccec4836fea6d3888881b8df53e3bb55f6c") {
            throw "The downloaded SoX source archive did not match the expected SHA-256."
          }
          Compress-Archive `
            -Path dist\Clarify.exe, dist\Clarify.exe.sha256, dist\Clarify.sbom.json, LICENSE, THIRD_PARTY_NOTICES.md `
            -DestinationPath dist\Clarify-windows-x64.zip `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Clarify-community-${{ github.ref_name }}
          path: |
            dist/Clarify.exe
            dist/Clarify.exe.sha256
            dist/Clarify.sbom.json
            dist/Clarify-windows-x64.zip
            dist/sox-14.4.2-source.tar.gz
          if-no-files-found: error

      - name: Attest community release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Clarify.exe
            dist/Clarify.exe.sha256
            dist/Clarify.sbom.json
            dist/Clarify-windows-x64.zip
            dist/sox-14.4.2-source.tar.gz

      - name: Publish unsigned community release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          This is an unsigned community portable release.

          Windows SmartScreen may show a warning because the executable does not have a paid Authenticode publisher signature. Verify Clarify.exe with Clarify.exe.sha256 before launching it.

          This free release contains the portable app only. The signed MSI and authenticated update manifest remain disabled until the project has sponsored signing infrastructure.
          "@
          gh release create "${{ github.ref_name }}" `
            dist\Clarify.exe `
            dist\Clarify.exe.sha256 `
            dist\Clarify.sbom.json `
            dist\Clarify-windows-x64.zip `
            dist\sox-14.4.2-source.tar.gz `
            --verify-tag `
            --notes $notes `
            --title "Clarify ${{ github.ref_name }}"
