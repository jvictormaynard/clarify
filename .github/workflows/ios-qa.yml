name: iOS internal QA preflight

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Strict candidate JSON data; see docs/testflight-qa.md
        required: false
        type: string
      source_sha:
        description: Exact reviewed current PR 179 HEAD
        type: string
      base_sha:
        description: Exact current main SHA
        type: string
      trusted_sha:
        description: Exact main workflow SHA
        type: string
      validation_run_id:
        description: Completed trusted validation run for this exact composition
        type: string
      validation_run_attempt:
        description: Exact completed validation attempt
        type: string
      producer_run_id:
        description: Completed archive run, for a later sign-export-proof dispatch only
        type: string
      producer_run_attempt:
        description: Exact completed archive attempt, for sign-export-proof only
        type: string
      archive_artifact_id:
        description: Archive API artifact ID, for sign-export-proof only
        type: string
      proof_run_id:
        description: Completed native export proof run for this exact tuple
        type: string
      proof_run_attempt:
        description: Exact native proof attempt
        type: string
      proof_artifact_id:
        description: Authenticated native proof receipt artifact
        type: string
      publication_run_id:
        description: Previous upload run, for availability only
        type: string
      publication_run_attempt:
        description: Exact previous upload attempt, for availability only
        type: string
      publication_artifact_id:
        description: Previous authenticated upload receipts, for availability only
        type: string
      inventory_run_id:
        description: Fresh complete GET-only Apple inventory run, for upload only
        type: string
      inventory_run_attempt:
        description: Exact fresh Apple inventory attempt
        type: string
      mode:
        description: Separate validation, unsigned Device archive and experimental export proof
        type: choice
        options: [validate, archive, sign-export-proof, preflight, upload, availability, inspect-archive43]
        default: validate

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: clarify-ios-testflight
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Internal QA preflight
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check exact source, current base, native CI and global upload history
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_CANDIDATE: ${{ inputs.candidate }}
          QA_MODE: ${{ inputs.mode }}
          QA_WORKFLOW_REF: ${{ github.workflow_ref }}
          QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python -m scripts.testflight_qa

  authenticate_validation:
    name: Authenticate trusted validation dispatch
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Authenticate MAIN, current PR and source objects
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.testflight_qa validate

  validation:
    name: Trusted validation
    needs: authenticate_validation
    uses: ./.github/workflows/ci.yml
    with:
      trusted_qa: true
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      trusted_sha: ${{ inputs.trusted_sha }}

  finalize_validation:
    name: Finalize trusted validation
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Recompute MAIN plan and authenticate exact-attempt API results
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SELECTED_KEYS: ${{ needs.validation.outputs.selected_keys }}
          QA_SOURCE_TREE: ${{ needs.validation.outputs.source_tree }}
          QA_BASE_TREE: ${{ needs.validation.outputs.base_tree }}
          QA_PLAN_DIGEST: ${{ needs.validation.outputs.plan_digest }}
          QA_CONTROLS_DIGEST: ${{ needs.validation.outputs.controls_digest }}
        run: python -m scripts.testflight_qa finalize
      - name: Upload trusted validation manifest
        id: validation_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-qa-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/validation.json
          if-no-files-found: error
          overwrite: false
      - name: Record trusted validation artifact
        working-directory: trusted
        env:
          QA_UPLOAD_ARTIFACT_ID: ${{ steps.validation_artifact.outputs.artifact-id }}
          QA_UPLOAD_ARTIFACT_DIGEST: ${{ steps.validation_artifact.outputs.artifact-digest }}
        run: python -m scripts.testflight_qa record

  archive:
    name: Unsigned Device Release archive
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'archive'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.archive_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive_artifact.outputs.artifact-digest }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out trusted MAIN controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact archive source without secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser without lifecycle scripts
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Authenticate validation and produce unsigned Device Release archive
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.testflight_qa archive
      - name: Upload unsigned Device archive
        id: archive_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-unsigned-${{ inputs.source_sha }}
          path: |
            unsigned-device-archive/unsigned.xcarchive.zip
            unsigned-device-archive/archive-envelope.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Retain unsigned archive diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-archive-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clarify-trusted-ci/logs/
            ${{ runner.temp }}/clarify-trusted-ci/archive-phases/
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

  finalize_archive:
    name: Finalize trusted Device archive
    needs: archive
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser without lifecycle scripts
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Record trusted Device archive
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_UPLOAD_ARTIFACT_ID: ${{ needs.archive.outputs.artifact_id }}
          QA_UPLOAD_ARTIFACT_DIGEST: ${{ needs.archive.outputs.artifact_digest }}
        run: python -m scripts.testflight_qa archive-record

  sign_export_proof:
    name: Experimental trusted export proof
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'sign-export-proof'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser before credential installation
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Authenticate completed archive and run experimental export proof
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CLARIFY_IOS_CERTIFICATE_BASE64: ${{ secrets.CLARIFY_IOS_CERTIFICATE_BASE64 }}
          CLARIFY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CLARIFY_IOS_CERTIFICATE_PASSWORD }}
          CLARIFY_IOS_PROFILES_GZIP_BASE64: ${{ secrets.CLARIFY_IOS_PROFILES_GZIP_BASE64 }}
        run: python -m scripts.testflight_qa sign-export-proof
      - name: Retain experimental export receipt
        id: proof_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-export-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive-proof/archive-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Record experimental export proof
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_UPLOAD_ARTIFACT_ID: ${{ steps.proof_artifact.outputs.artifact-id }}
          QA_UPLOAD_ARTIFACT_DIGEST: ${{ steps.proof_artifact.outputs.artifact-digest }}
        run: python -m scripts.testflight_qa proof-record

  upload:
    name: Upload verified internal preview
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'upload'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser before credential installation
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Authenticate publication gates
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.testflight_qa publication-gate
      - name: Export and verify internal preview
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CLARIFY_IOS_CERTIFICATE_BASE64: ${{ secrets.CLARIFY_IOS_CERTIFICATE_BASE64 }}
          CLARIFY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CLARIFY_IOS_CERTIFICATE_PASSWORD }}
          CLARIFY_IOS_PROFILES_GZIP_BASE64: ${{ secrets.CLARIFY_IOS_PROFILES_GZIP_BASE64 }}
        run: python -m scripts.testflight_qa publication-export
      - name: Upload exactly once to Apple
        id: upload_attempt
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: python -m scripts.testflight_qa publication-upload
      - name: Retain internal publication receipts
        id: publication_artifact
        if: ${{ always() && steps.upload_attempt.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clarify-ios-qa/context.json
            ${{ runner.temp }}/clarify-ios-qa/output/verification.json
            ${{ runner.temp }}/clarify-ios-qa/output/upload-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Record internal publication artifact
        if: ${{ always() && steps.publication_artifact.outcome == 'success' }}
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_UPLOAD_ARTIFACT_ID: ${{ steps.publication_artifact.outputs.artifact-id }}
          QA_UPLOAD_ARTIFACT_DIGEST: ${{ steps.publication_artifact.outputs.artifact-digest }}
        run: python -m scripts.testflight_qa publication-record
      - name: Remove private preview IPA and staging
        if: always()
        working-directory: trusted
        run: python -m scripts.testflight_qa publication-cleanup

  availability:
    name: Complete internal preview availability
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'availability'
    runs-on: macos-26
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser without lifecycle scripts
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Authenticate upload receipt and complete existing internal group availability
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CLARIFY_ASC_KEY_P8: ${{ secrets.CLARIFY_ASC_KEY_P8 }}
          CLARIFY_ASC_KEY_ID: ${{ secrets.CLARIFY_ASC_KEY_ID }}
          CLARIFY_ASC_ISSUER_ID: ${{ secrets.CLARIFY_ASC_ISSUER_ID }}
        run: python -m scripts.testflight_qa availability
      - name: Retain internal group availability receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clarify-ios-qa/output/testflight-availability.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Remove availability staging
        if: always()
        working-directory: trusted
        run: python -m scripts.testflight_qa publication-cleanup

  archive43_inspection_diagnostic:
    name: Secret-free archive43 pre-key inspection
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/ios-archive43-prekey-diagnostic-20261028' &&
      inputs.mode == 'inspect-archive43'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out immutable MAIN inspection controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be4796c7c771af98a5782acb2eef9a5d4d50e3c4
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install frozen MAIN parser without scripts
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Inspect existing archive and stop before credentials
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys, traceback
          from scripts import testflight_qa as q
          a=q.device_archive
          root=Path.cwd().resolve()
          out=root.parent/'archive43-inspection'
          out.mkdir(exist_ok=False)
          main='be4796c7c771af98a5782acb2eef9a5d4d50e3c4'
          source='1f83734940082f19b5f2d4f38d2ce3ba268f6ec4'
          state=dict(schema=1,diagnostic_only=True,delivery_eligible=False,apple_upload=False,
                     controller_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
                     run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],trusted_sha=main,source_sha=source,
                     producer_run_id=40640660173,archive_artifact_id=12795557560,
                     stopped_before_credentials=False,credential_commands_executed=0,
                     phase='authenticate-original-producer',safe_frames=[])
          def stop_before_credentials(command, *, cwd, env):
              if command[-1]=='install':
                  state['stopped_before_credentials']=True
                  raise RuntimeError('Diagnostic stop before credentials')
              if command[-1]=='clean' and state['stopped_before_credentials']:
                  return subprocess.CompletedProcess(command,0,b'',b'')
              raise AssertionError('Diagnostic refuses every other command')
          try:
              assert sys.platform=='darwin'
              assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==main
              api=q.ArchiveGitHub(os.environ['GH_TOKEN'])
              run=api.run(40640660173,1)
              assert run['head_sha']==main and run['status']=='completed' and run['conclusion']=='success'
              # This context authenticates the ORIGINAL MAIN producer. It does not assert
              # that this separate diagnostic controller is MAIN or approval authority.
              context=dict(repository=q.REPOSITORY,event='workflow_dispatch',ref='refs/heads/main',
                           workflow_ref=q.REPOSITORY+'/'+q.QA_PATH+'@refs/heads/main',workflow_sha=main,
                           checkout_sha=main,sha=main,actor=run['actor']['login'],
                           triggering_actor=run['triggering_actor']['login'],run_id=40640660173,
                           run_attempt=1,mode='archive')
              candidate=dict(schema=1,pr=179,source_sha=source,base_sha=main,app_id=q.APP_ID,
                             bundle_id=q.BUNDLE,version='0.12.0',build='43',
                             tag='ios/pr-179/v0.12.0-build43',relay_host=None)
              inputs=dict(source_sha=source,base_sha=main,trusted_sha=main,candidate=candidate,
                          validation_run_id=40637201970,validation_run_attempt=1,
                          producer_run_id=40640660173,producer_run_attempt=1)
              policy=q.archive_policy(api,inputs,context,q.observe_archive_toolchain())
              state['phase']='inspect-frozen-archive-before-keys'
              a.sign_export(api=api,policy=policy,artifact_id=12795557560,
                            runner_temp=Path(os.environ['RUNNER_TEMP']),trusted_root=root,
                            runner=stop_before_credentials)
          except BaseException as error:
              allowed={'ArchiveError','ReleaseError','ValueError','OSError','KeyError','TypeError','RuntimeError','AssertionError'}
              state['error_type']=type(error).__name__ if type(error).__name__ in allowed else 'validation-error'
              # Only trusted source locations, functions and line numbers. No exception
              # text, arguments, locals, candidate filenames or captured command streams.
              for frame in traceback.extract_tb(error.__traceback__):
                  path=Path(frame.filename).resolve()
                  if path in {root/'scripts/testflight_qa.py',root/'scripts/qa_device_archive.py'}:
                      state['safe_frames'].append(dict(file=path.relative_to(root).as_posix(),
                                                      function=frame.name,line=frame.lineno))
              state['result']='stopped-before-credentials' if state['stopped_before_credentials'] else 'pre-key-validation-failed'
              (out/'diagnostic-result.json').write_text(json.dumps(state,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(state,sort_keys=True))
              sys.exit(0 if state['stopped_before_credentials'] else 1)
          raise SystemExit('Diagnostic did not reach its mandatory stop')
          PY
      - name: Retain inert pre-key diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-archive43-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive43-inspection/diagnostic-result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
