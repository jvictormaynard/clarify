name: iOS internal QA preflight

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Strict candidate JSON data; see docs/testflight-qa.md
        required: false
        type: string
      source_sha:
        description: Exact reviewed current PR 179 HEAD
        type: string
      base_sha:
        description: Exact current main SHA
        type: string
      trusted_sha:
        description: Exact main workflow SHA
        type: string
      validation_run_id:
        description: Completed trusted validation run for this exact composition
        type: string
      validation_run_attempt:
        description: Exact completed validation attempt
        type: string
      producer_run_id:
        description: Completed archive run, for a later sign-export-proof dispatch only
        type: string
      producer_run_attempt:
        description: Exact completed archive attempt, for sign-export-proof only
        type: string
      archive_artifact_id:
        description: Archive API artifact ID, for sign-export-proof only
        type: string
      mode:
        description: Separate validation, unsigned Device archive and experimental export proof
        type: choice
        options: [validate, archive, sign-export-proof, preflight, upload, availability]
        default: validate

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: clarify-ios-testflight
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Internal QA preflight
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      contains(fromJSON('["preflight","upload","availability"]'), inputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check exact source, current base, native CI and global upload history
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_CANDIDATE: ${{ inputs.candidate }}
          QA_MODE: ${{ inputs.mode }}
          QA_WORKFLOW_REF: ${{ github.workflow_ref }}
          QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python -m scripts.testflight_qa

  authenticate_validation:
    name: Authenticate trusted validation dispatch
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Authenticate MAIN, current PR and source objects
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.testflight_qa validate

  validation:
    name: Trusted validation
    needs: authenticate_validation
    uses: ./.github/workflows/ci.yml
    with:
      trusted_qa: true
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      trusted_sha: ${{ inputs.trusted_sha }}

  finalize_validation:
    name: Finalize trusted validation
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Recompute MAIN plan and authenticate exact-attempt API results
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SELECTED_KEYS: ${{ needs.validation.outputs.selected_keys }}
          QA_SOURCE_TREE: ${{ needs.validation.outputs.source_tree }}
          QA_BASE_TREE: ${{ needs.validation.outputs.base_tree }}
          QA_PLAN_DIGEST: ${{ needs.validation.outputs.plan_digest }}
          QA_CONTROLS_DIGEST: ${{ needs.validation.outputs.controls_digest }}
        run: python -m scripts.testflight_qa finalize
      - name: Upload trusted validation manifest
        id: validation_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-qa-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/validation.json
          if-no-files-found: error
          overwrite: false
      - name: Record trusted validation artifact
        working-directory: trusted
        env:
          QA_UPLOAD_ARTIFACT_ID: ${{ steps.validation_artifact.outputs.artifact-id }}
          QA_UPLOAD_ARTIFACT_DIGEST: ${{ steps.validation_artifact.outputs.artifact-digest }}
        run: python -m scripts.testflight_qa record

  archive:
    name: Unsigned Device Release archive
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'archive'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.archive_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive_artifact.outputs.artifact-digest }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out trusted MAIN controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact archive source without secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser without lifecycle scripts
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Authenticate validation and produce unsigned Device Release archive
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.testflight_qa archive
      - name: Upload unsigned Device archive
        id: archive_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-unsigned-${{ inputs.source_sha }}
          path: |
            unsigned-device-archive/unsigned.xcarchive.zip
            unsigned-device-archive/archive-envelope.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  finalize_archive:
    name: Finalize trusted Device archive
    needs: archive
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser without lifecycle scripts
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Record trusted Device archive
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          QA_UPLOAD_ARTIFACT_ID: ${{ needs.archive.outputs.artifact_id }}
          QA_UPLOAD_ARTIFACT_DIGEST: ${{ needs.archive.outputs.artifact_digest }}
        run: python -m scripts.testflight_qa archive-record

  sign_export_proof:
    name: Experimental trusted export proof
    if: >-
      github.repository == 'jvictormaynard/clarify' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.mode == 'sign-export-proof'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.21.1
      - name: Install MAIN YAML parser before credential installation
        working-directory: trusted/desktop
        run: npm ci --ignore-scripts --no-fund
      - name: Authenticate completed archive and run experimental export proof
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          CLARIFY_IOS_CERTIFICATE_BASE64: ${{ secrets.CLARIFY_IOS_CERTIFICATE_BASE64 }}
          CLARIFY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CLARIFY_IOS_CERTIFICATE_PASSWORD }}
          CLARIFY_IOS_PROFILES_GZIP_BASE64: ${{ secrets.CLARIFY_IOS_PROFILES_GZIP_BASE64 }}
        run: python -m scripts.testflight_qa sign-export-proof
      - name: Retain experimental export receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clarify-ios-qa-export-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: archive-proof/archive-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
